<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>lXlYlZl · 动态 Logo 预览</title>
  <link rel="stylesheet" href="css/logo-motion-demo.css?v=3">
</head>
<body data-theme="light">
  <header><a href="index.html">lXlYlZl</a><span>动态标志 · 本地预览</span></header>
  <main>
    <h1>标志展开，名字登场。</h1>
    <p class="intro">转动、构造、还原；字标展开，再加粗定格。</p>
    <div class="canvas" id="canvas" aria-busy="true">
      <button id="logo-replay" aria-label="从头播放标志动画" disabled><span id="logo-host"></span></button>
      <p id="load-state" role="status">正在载入矢量标志…</p>
    </div>
    <div class="controls">
      <button id="toggle" aria-pressed="false" disabled>暂停</button>
      <button id="restart" disabled>重播</button>
      <label for="theme">底色</label>
      <select id="theme"><option value="dark">暗色</option><option value="light" selected>浅色</option><option value="orange">橙色</option></select>
    </div>
    <div class="frame-controls"><label for="frame">逐帧查看</label><input id="frame" type="range" min="0" max="94" step="1" value="0" disabled></div>
    <p class="note" id="motion-state" role="status">9.5 秒循环 · 首帧 +10 帧，尾帧 +15 帧</p>
  </main>
  <footer><span>独立演示，不影响线上网站</span><a href="assets/logo-motion.svg" download="lxlylzl-animated-logo.svg">下载透明背景 SVG ↗</a></footer>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="js/logo-motion-demo.js?v=10"></script>
</body>
</html>
