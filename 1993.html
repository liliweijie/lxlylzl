<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lxlylzl · 后台</title>
<style>
:root{
  --bg:#0E0E12; --text:#EDEDF0; --text-2:#9a9aa5;
  --panel:rgba(255,255,255,0.04); --panel-border:rgba(255,255,255,0.10);
  --accent:#E85D3B;
}
[data-theme="light"]{
  --bg:#F4F4F6; --text:#16161A; --text-2:#6a6a75;
  --panel:rgba(0,0,0,0.03); --panel-border:rgba(0,0,0,0.10);
  --accent:#E85D3B;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  transition:background .4s, color .4s; padding:32px;
}
.wrap{max-width:820px; margin:0 auto;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;}
h1{font-size:18px; font-weight:700; letter-spacing:.02em; margin:0;}
.count{color:var(--text-2); font-size:13px; margin-left:10px; font-weight:400;}
.theme-toggle{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--panel-border);
  background:var(--panel); color:var(--text); cursor:pointer; display:flex;
  align-items:center; justify-content:center;
}
.theme-toggle svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.6;}
.login{
  background:var(--panel); border:1px solid var(--panel-border); border-radius:18px;
  padding:28px; text-align:center; backdrop-filter:blur(20px);
}
.login p{color:var(--text-2); font-size:13px; margin:0 0 16px;}
.login input{
  width:100%; max-width:320px; padding:12px 14px; border-radius:12px;
  border:1px solid var(--panel-border); background:rgba(127,127,127,0.08);
  color:var(--text); font-size:14px; outline:none; margin-bottom:10px;
}
.login input:last-of-type{margin-bottom:0;}
.login input:focus{border-color:var(--accent);}
.btn{
  border:none; cursor:pointer; border-radius:12px; padding:10px 18px;
  font-size:14px; font-weight:600; font-family:inherit;
}
.btn-primary{background:var(--accent); color:#fff;}
.btn-ghost{background:var(--panel); color:var(--text); border:1px solid var(--panel-border);}
.btn-danger{background:transparent; color:var(--accent); border:1px solid var(--accent);}
.row{display:flex; gap:8px; justify-content:center; margin-top:14px;}
.toolbar{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
.toolbar .spacer{flex:1;}
.toolbar .hint{color:var(--text-2); font-size:13px;}
.confirm-bar{
  display:flex; align-items:center; gap:10px; flex:1;
  background:rgba(232,93,59,0.10); border:1px solid var(--accent);
  border-radius:12px; padding:10px 14px;
}
.confirm-bar .warn{font-size:13px; color:var(--accent); flex:1; line-height:1.5;}
.list{display:flex; flex-direction:column; gap:12px; margin-top:8px;}
.item{
  background:var(--panel); border:1px solid var(--panel-border); border-radius:16px;
  padding:16px 18px; backdrop-filter:blur(20px);
}
.item .meta{display:flex; align-items:center; gap:8px; margin-bottom:8px; color:var(--text-2); font-size:12px;}
.item .edited{color:var(--accent);}
.item .content{font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word;}
.item textarea{
  width:100%; min-height:60px; resize:vertical; padding:10px; border-radius:10px;
  border:1px solid var(--panel-border); background:rgba(127,127,127,0.08);
  color:var(--text); font-size:14px; font-family:inherit; outline:none;
}
.item .actions{display:flex; gap:8px; margin-top:12px;}
.empty{text-align:center; color:var(--text-2); padding:40px 0; font-size:14px;}
.err{color:var(--accent); font-size:13px; text-align:center; margin-top:10px; min-height:16px;}
</style>
</head>
<body data-theme="dark">
<div class="wrap">
  <div class="topbar">
    <h1>lxlylzl · 后台<span class="count" id="count"></span></h1>
    <button class="theme-toggle" id="themeToggle" aria-label="切换明暗">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
    </button>
  </div>

  <div id="loginView" class="login">
    <p>请输入后台账号与密码以管理碎碎念评论</p>
    <input type="text" id="userInput" placeholder="账号" autocomplete="off">
    <input type="password" id="passInput" placeholder="密码" autocomplete="off">
    <div class="row">
      <button class="btn btn-primary" id="enterBtn">进入</button>
    </div>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="adminView" style="display:none;">
    <div class="toolbar">
      <button class="btn btn-ghost" id="refreshBtn">刷新</button>
      <span class="spacer"></span>
      <button class="btn btn-danger" id="delAllBtn">一键清空所有留言</button>
    </div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" style="display:none;">暂无评论</div>
  </div>
</div>

<script>
// 明暗主题（与站点一致）
(function(){
  var t=document.getElementById('themeToggle');
  var saved=localStorage.getItem('theme');
  if(saved) document.body.setAttribute('data-theme',saved);
  t.addEventListener('click',function(){
    var cur=document.body.getAttribute('data-theme');
    var next=cur==='dark'?'light':'dark';
    document.body.setAttribute('data-theme',next);
    localStorage.setItem('theme',next);
  });
})();

var user='', pass='';
var currentCount=0;
var loginView=document.getElementById('loginView');
var adminView=document.getElementById('adminView');
var listEl=document.getElementById('list');
var emptyEl=document.getElementById('empty');
var countEl=document.getElementById('count');
var loginErr=document.getElementById('loginErr');
var delAllBtn=document.getElementById('delAllBtn');
var toolbar=delAllBtn.parentNode;

document.getElementById('enterBtn').addEventListener('click',enter);
document.getElementById('userInput').addEventListener('keydown',function(e){if(e.key==='Enter')enter();});
document.getElementById('passInput').addEventListener('keydown',function(e){if(e.key==='Enter')enter();});
document.getElementById('refreshBtn').addEventListener('click',load);
delAllBtn.addEventListener('click',askDeleteAll);

// 用 GET ?probe=1 校验账号密码（账号密码走 query，无自定义请求头 -> 不触发跨域预检，避免"网络错误"）
function enter(){
  var u=document.getElementById('userInput').value.trim();
  var v=document.getElementById('passInput').value;
  if(!u||!v){loginErr.textContent='请输入账号和密码';return;}
  loginErr.textContent='';
  fetch('/api/notes?probe=1&user='+encodeURIComponent(u)+'&pass='+encodeURIComponent(v),{method:'GET'}).then(function(r){
    if(r.status===401){loginErr.textContent='账号或密码错误';return;}
    if(!r.ok){loginErr.textContent='登录失败，请重试';return;}
    user=u; pass=v;
    loginView.style.display='none';
    adminView.style.display='block';
    load();
  }).catch(function(){loginErr.textContent='网络错误，请检查网络连接';});
}

// 一键清空：二次确认（先展开确认条，再点「确认清空」才真正执行）
function askDeleteAll(){
  var bar=document.createElement('div');
  bar.className='confirm-bar';
  var warn=document.createElement('span');
  warn.className='warn';
  warn.textContent='确定清空全部 '+currentCount+' 条留言吗？此操作不可恢复。';
  var okBtn=document.createElement('button');
  okBtn.className='btn btn-danger'; okBtn.textContent='确认清空';
  var cancelBtn=document.createElement('button');
  cancelBtn.className='btn btn-ghost'; cancelBtn.textContent='取消';
  bar.appendChild(warn); bar.appendChild(okBtn); bar.appendChild(cancelBtn);
  delAllBtn.style.display='none';
  toolbar.insertBefore(bar, delAllBtn);
  okBtn.addEventListener('click',function(){
    okBtn.disabled=true; okBtn.textContent='清空中…';
    fetch('/api/notes?all=1',{method:'DELETE',headers:{'x-admin-user':user,'x-admin-pass':pass}})
      .then(function(r){return r.json();}).then(function(){
        if(bar.parentNode) bar.parentNode.removeChild(bar);
        delAllBtn.style.display='';
        load();
      }).catch(function(){okBtn.disabled=false; okBtn.textContent='确认清空';});
  });
  cancelBtn.addEventListener('click',function(){
    if(bar.parentNode) bar.parentNode.removeChild(bar);
    delAllBtn.style.display='';
  });
}

function fmt(ts){
  if(!ts)return'';
  var d=new Date(ts);
  function p(n){return (n<10?'0':'')+n;}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

function load(){
  fetch('/api/notes').then(function(r){return r.json();}).then(function(arr){
    if(!Array.isArray(arr))arr=[];
    currentCount=arr.length;
    countEl.textContent='（'+arr.length+' 条）';
    listEl.innerHTML='';
    if(arr.length===0){emptyEl.style.display='block';return;}
    emptyEl.style.display='none';
    arr.forEach(function(n){listEl.appendChild(renderItem(n));});
  }).catch(function(){emptyEl.style.display='block';emptyEl.textContent='加载失败';});
}

function renderItem(n){
  var item=document.createElement('div');
  item.className='item';
  var meta=document.createElement('div');
  meta.className='meta';
  meta.innerHTML='<span>'+fmt(n.ts)+'</span>'+(n.edited?'<span class="edited">· 已编辑</span>':'')+(n.replies&&n.replies.length?'<span>· '+n.replies.length+' 回复</span>':'');
  var content=document.createElement('div');
  content.className='content';
  content.textContent=n.content;
  var actions=document.createElement('div');
  actions.className='actions';
  var editBtn=document.createElement('button');
  editBtn.className='btn btn-ghost'; editBtn.textContent='编辑';
  var delBtn=document.createElement('button');
  delBtn.className='btn btn-danger'; delBtn.textContent='删除';
  actions.appendChild(editBtn); actions.appendChild(delBtn);
  item.appendChild(meta); item.appendChild(content); item.appendChild(actions);

  editBtn.addEventListener('click',function(){
    var ta=document.createElement('textarea');
    ta.value=n.content;
    item.replaceChild(ta,content);
    editBtn.textContent='保存'; delBtn.textContent='取消';
    editBtn.onclick=function(){
      var v=ta.value.trim();
      if(!v)return;
      fetch('/api/notes?id='+n.id,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-user':user,'x-admin-pass':pass},body:JSON.stringify({content:v})})
        .then(function(r){return r.json();}).then(function(upd){
          n.content=upd.content; n.edited=true;
          content.textContent=upd.content;
          item.replaceChild(content,ta);
          editBtn.textContent='编辑'; delBtn.textContent='删除';
          editBtn.onclick=null;
          meta.innerHTML='<span>'+fmt(n.ts)+'</span><span class="edited">· 已编辑</span>';
        });
    };
    delBtn.onclick=function(){
      item.replaceChild(content,ta);
      editBtn.textContent='编辑'; delBtn.textContent='删除';
      editBtn.onclick=null;
    };
  });

  delBtn.addEventListener('click',function(){
    if(!confirm('确定删除这条评论？'))return;
    fetch('/api/notes?id='+n.id,{method:'DELETE',headers:{'x-admin-user':user,'x-admin-pass':pass}})
      .then(function(r){return r.json();}).then(function(){
        item.remove();
        load();
      });
  });

  return item;
}
</script>
</body>
</html>
