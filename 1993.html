<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lxlylzl · 后台</title>
<style>
:root{
  --bg:#0E0E12; --text:#EDEDF0; --text-2:#9a9aa5;
  --panel:rgba(255,255,255,0.04); --panel-border:rgba(255,255,255,0.10);
  --accent:#E85D3B;
}
[data-theme="light"]{
  --bg:#F4F4F6; --text:#16161A; --text-2:#6a6a75;
  --panel:rgba(0,0,0,0.03); --panel-border:rgba(0,0,0,0.10);
  --accent:#E85D3B;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  transition:background .4s, color .4s; padding:32px;
}
.wrap{max-width:820px; margin:0 auto;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;}
h1{font-size:18px; font-weight:700; letter-spacing:.02em; margin:0;}
.count{color:var(--text-2); font-size:13px; margin-left:10px; font-weight:400;}
.theme-toggle{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--panel-border);
  background:var(--panel); color:var(--text); cursor:pointer; display:flex;
  align-items:center; justify-content:center;
}
.theme-toggle svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.6;}
.login{
  background:var(--panel); border:1px solid var(--panel-border); border-radius:18px;
  padding:28px; text-align:center; backdrop-filter:blur(20px);
}
.login p{color:var(--text-2); font-size:13px; margin:0 0 16px;}
.login input{
  width:100%; max-width:320px; padding:12px 14px; border-radius:12px;
  border:1px solid var(--panel-border); background:rgba(127,127,127,0.08);
  color:var(--text); font-size:14px; outline:none; margin-bottom:10px;
}
.login input:last-of-type{margin-bottom:0;}
.login input:focus{border-color:var(--accent);}
.btn{
  border:none; cursor:pointer; border-radius:12px; padding:10px 18px;
  font-size:14px; font-weight:600; font-family:inherit;
}
.btn-primary{background:var(--accent); color:#fff;}
.btn-ghost{background:var(--panel); color:var(--text); border:1px solid var(--panel-border);}
.btn-danger{background:transparent; color:var(--accent); border:1px solid var(--accent);}
.row{display:flex; gap:8px; justify-content:center; margin-top:14px;}
.toolbar{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
.toolbar .spacer{flex:1;}
.toolbar .hint{color:var(--text-2); font-size:13px;}
.confirm-bar{
  display:flex; align-items:center; gap:10px; flex:1;
  background:rgba(232,93,59,0.10); border:1px solid var(--accent);
  border-radius:12px; padding:10px 14px;
}
.confirm-bar .warn{font-size:13px; color:var(--accent); flex:1; line-height:1.5;}
.list{display:flex; flex-direction:column; gap:12px; margin-top:8px;}
.item{
  background:var(--panel); border:1px solid var(--panel-border); border-radius:16px;
  padding:16px 18px; backdrop-filter:blur(20px);
}
.item .meta{display:flex; align-items:center; gap:8px; margin-bottom:8px; color:var(--text-2); font-size:12px;}
.item .edited{color:var(--accent);}
.item .content{font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word;}
.item textarea{
  width:100%; min-height:60px; resize:vertical; padding:10px; border-radius:10px;
  border:1px solid var(--panel-border); background:rgba(127,127,127,0.08);
  color:var(--text); font-size:14px; font-family:inherit; outline:none;
}
.item .actions{display:flex; gap:8px; margin-top:12px;}
.empty{text-align:center; color:var(--text-2); padding:40px 0; font-size:14px;}
.err{color:var(--accent); font-size:13px; text-align:center; margin-top:10px; min-height:16px;}

/* ===== TABS ===== */
.tabs{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
.tab{
  border:1px solid var(--panel-border); background:var(--panel); color:var(--text);
  border-radius:100px; padding:8px 20px; font-size:13px; cursor:pointer; font-family:inherit;
  transition:border-color .2s, background .2s, color .2s;
}
.tab:hover{border-color:var(--accent);}
.tab.is-active{background:var(--accent); color:#fff; border-color:var(--accent);}
.panel{display:block;}
.panel-head{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
.panel-head .spacer{flex:1;}
.saved-hint{color:var(--accent); font-size:13px; opacity:0; transition:opacity .3s; margin-left:4px;}
.about-section-title{
  font-size:12px; letter-spacing:.25em; text-transform:uppercase;
  color:var(--text-2); opacity:.7; margin:22px 0 12px;
}

/* ===== EDITOR CARD ===== */
.editor-card{
  background:var(--panel); border:1px solid var(--panel-border); border-radius:16px;
  padding:16px 18px; margin-bottom:14px; backdrop-filter:blur(20px);
}
.editor-card .field{margin-bottom:12px;}
.editor-card .field:last-child{margin-bottom:0;}
.editor-card label{display:block; font-size:12px; color:var(--text-2); margin:0 0 6px;}
.editor-card input, .editor-card textarea{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--panel-border);
  background:rgba(127,127,127,0.08); color:var(--text); font-size:14px;
  font-family:inherit; outline:none; box-sizing:border-box;
}
.editor-card input:focus, .editor-card textarea:focus{border-color:var(--accent);}
.editor-card textarea{resize:vertical;}
.row2{display:flex; gap:10px;}
.row2 > div{flex:1;}
.upload-block{margin:12px 0; padding:12px; border:1px dashed var(--panel-border); border-radius:12px; background:rgba(127,127,127,0.05);}
.upload-block .ub-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.upload-block input[type=file]{width:auto; max-width:100%; padding:8px; font-size:12px;}
.up-btn{background:var(--accent); color:#fff; border:none; border-radius:10px; padding:8px 14px; font-size:13px; cursor:pointer; font-family:inherit;}
.up-btn:hover{opacity:0.9;}
.up-status{font-size:12px; color:var(--text-2); margin-left:4px;}
.up-status.ok{color:#5ac97a;}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.card-title{font-size:13px; font-weight:600; color:var(--text-2);}
.del{
  background:transparent; color:var(--accent); border:1px solid var(--accent);
  border-radius:10px; padding:6px 12px; font-size:12px; cursor:pointer; font-family:inherit;
}
.del:hover{background:rgba(232,93,59,0.10);}
</style>
</head>
<body data-theme="dark">
<div class="wrap">
  <div class="topbar">
    <h1>lxlylzl · 后台<span class="count" id="count"></span></h1>
    <button class="theme-toggle" id="themeToggle" aria-label="切换明暗">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
    </button>
  </div>

  <div id="loginView" class="login">
    <p>请输入后台账号与密码以管理站点内容</p>
    <input type="text" id="userInput" placeholder="账号" autocomplete="off">
    <input type="password" id="passInput" placeholder="密码" autocomplete="off">
    <div class="row">
      <button class="btn btn-primary" id="enterBtn">进入</button>
    </div>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="adminView" style="display:none;">
    <div class="tabs">
      <button class="tab is-active" data-tab="notes">碎碎念</button>
      <button class="tab" data-tab="works">作品</button>
      <button class="tab" data-tab="index">首页</button>
      <button class="tab" data-tab="about">关于</button>
    </div>

    <!-- 碎碎念 -->
    <div class="panel" id="panel-notes">
      <div class="toolbar">
        <button class="btn btn-ghost" id="refreshBtn">刷新</button>
        <span class="spacer"></span>
        <button class="btn btn-danger" id="delAllBtn">一键清空所有留言</button>
      </div>
      <div class="list" id="list"></div>
      <div class="empty" id="empty" style="display:none;">暂无评论</div>
    </div>

    <!-- 作品 -->
    <div class="panel" id="panel-works" style="display:none;">
      <div class="panel-head">
        <button class="btn btn-ghost" id="worksAdd">＋ 新建作品</button>
        <span class="spacer"></span>
        <span class="saved-hint" id="hint-works"></span>
        <button class="btn btn-primary" id="worksSave">保存</button>
      </div>
      <div class="list" id="worksList"></div>
      <div class="empty" id="worksEmpty" style="display:none;">暂无作品，点「新建作品」添加</div>
    </div>

    <!-- 首页 -->
    <div class="panel" id="panel-index" style="display:none;">
      <div class="panel-head">
        <span class="spacer"></span>
        <span class="saved-hint" id="hint-index"></span>
        <button class="btn btn-primary" id="indexSave">保存</button>
      </div>
      <div class="editor-card">
        <div class="field"><label>眉标（小字）</label><input type="text" id="idx_eyebrow"></div>
        <div class="field"><label>主标题（可换行，用回车分隔）</label><textarea id="idx_title" rows="2"></textarea></div>
        <div class="field"><label>副标题</label><input type="text" id="idx_subtitle"></div>
        <div class="field"><label>简介</label><input type="text" id="idx_intro"></div>
      </div>
      <div class="about-section-title">社交链接</div>
      <div class="list" id="idx_socials"></div>
      <button class="btn btn-ghost" id="idx_socAdd" style="margin-top:10px;">＋ 添加社交链接</button>
    </div>

    <!-- 关于 -->
    <div class="panel" id="panel-about" style="display:none;">
      <div class="panel-head">
        <span class="spacer"></span>
        <span class="saved-hint" id="hint-about"></span>
        <button class="btn btn-primary" id="aboutSave">保存</button>
      </div>
      <div class="about-section-title">个人简介（逐段）</div>
      <div class="list" id="abt_bio"></div>
      <button class="btn btn-ghost" id="abt_bioAdd" style="margin-top:10px;">＋ 添加段落</button>
      <div class="about-section-title">技能（逗号分隔）</div>
      <div class="editor-card">
        <div class="field"><input type="text" id="abt_skills"></div>
      </div>
      <div class="about-section-title">联系方式</div>
      <div class="list" id="abt_contact"></div>
      <button class="btn btn-ghost" id="abt_ctAdd" style="margin-top:10px;">＋ 添加联系方式</button>
    </div>
  </div>
</div>

<script>
// 明暗主题（与站点一致）
(function(){
  var t=document.getElementById('themeToggle');
  var saved=localStorage.getItem('theme');
  if(saved) document.body.setAttribute('data-theme',saved);
  t.addEventListener('click',function(){
    var cur=document.body.getAttribute('data-theme');
    var next=cur==='dark'?'light':'dark';
    document.body.setAttribute('data-theme',next);
    localStorage.setItem('theme',next);
  });
})();

var user='', pass='';
var currentCount=0;
var loginView=document.getElementById('loginView');
var adminView=document.getElementById('adminView');
var listEl=document.getElementById('list');
var emptyEl=document.getElementById('empty');
var countEl=document.getElementById('count');
var loginErr=document.getElementById('loginErr');
var delAllBtn=document.getElementById('delAllBtn');
var toolbar=delAllBtn.parentNode;

document.getElementById('enterBtn').addEventListener('click',enter);
document.getElementById('userInput').addEventListener('keydown',function(e){if(e.key==='Enter')enter();});
document.getElementById('passInput').addEventListener('keydown',function(e){if(e.key==='Enter')enter();});
document.getElementById('refreshBtn').addEventListener('click',load);
delAllBtn.addEventListener('click',askDeleteAll);

// ===== TABS =====
var tabBtns=document.querySelectorAll('.tab');
var loaded={works:false, index:false, about:false};
tabBtns.forEach(function(btn){
  btn.addEventListener('click',function(){ switchTab(btn.getAttribute('data-tab')); });
});
function switchTab(name){
  tabBtns.forEach(function(b){ b.classList.toggle('is-active', b.getAttribute('data-tab')===name); });
  ['notes','works','index','about'].forEach(function(p){
    document.getElementById('panel-'+p).style.display = (p===name)?'block':'none';
  });
  if(name==='notes'){ load(); }
  else if(name==='works' && !loaded.works){ loadWorks(); loaded.works=true; }
  else if(name==='index' && !loaded.index){ loadIndex(); loaded.index=true; }
  else if(name==='about' && !loaded.about){ loadAbout(); loaded.about=true; }
}

// 用 GET ?probe=1 校验账号密码（账号密码走 query，无自定义请求头 -> 不触发跨域预检，避免"网络错误"）
function enter(){
  var u=document.getElementById('userInput').value.trim();
  var v=document.getElementById('passInput').value;
  if(!u||!v){loginErr.textContent='请输入账号和密码';return;}
  loginErr.textContent='';
  fetch('/api/notes?probe=1&user='+encodeURIComponent(u)+'&pass='+encodeURIComponent(v),{method:'GET'}).then(function(r){
    if(r.status===401){loginErr.textContent='账号或密码错误';return;}
    if(!r.ok){loginErr.textContent='登录失败，请重试';return;}
    user=u; pass=v;
    loginView.style.display='none';
    adminView.style.display='block';
    load();
  }).catch(function(){loginErr.textContent='网络错误，请检查网络连接';});
}

// 一键清空：二次确认（先展开确认条，再点「确认清空」才真正执行）
function askDeleteAll(){
  var bar=document.createElement('div');
  bar.className='confirm-bar';
  var warn=document.createElement('span');
  warn.className='warn';
  warn.textContent='确定清空全部 '+currentCount+' 条留言吗？此操作不可恢复。';
  var okBtn=document.createElement('button');
  okBtn.className='btn btn-danger'; okBtn.textContent='确认清空';
  var cancelBtn=document.createElement('button');
  cancelBtn.className='btn btn-ghost'; cancelBtn.textContent='取消';
  bar.appendChild(warn); bar.appendChild(okBtn); bar.appendChild(cancelBtn);
  delAllBtn.style.display='none';
  toolbar.insertBefore(bar, delAllBtn);
  okBtn.addEventListener('click',function(){
    okBtn.disabled=true; okBtn.textContent='清空中…';
    fetch('/api/notes?all=1',{method:'DELETE',headers:{'x-admin-user':user,'x-admin-pass':pass}})
      .then(function(r){return r.json();}).then(function(){
        if(bar.parentNode) bar.parentNode.removeChild(bar);
        delAllBtn.style.display='';
        load();
      }).catch(function(){okBtn.disabled=false; okBtn.textContent='确认清空';});
  });
  cancelBtn.addEventListener('click',function(){
    if(bar.parentNode) bar.parentNode.removeChild(bar);
    delAllBtn.style.display='';
  });
}

function fmt(ts){
  if(!ts)return'';
  var d=new Date(ts);
  function p(n){return (n<10?'0':'')+n;}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

function load(){
  fetch('/api/notes').then(function(r){return r.json();}).then(function(arr){
    if(!Array.isArray(arr))arr=[];
    currentCount=arr.length;
    countEl.textContent='（'+arr.length+' 条）';
    listEl.innerHTML='';
    if(arr.length===0){emptyEl.style.display='block';return;}
    emptyEl.style.display='none';
    arr.forEach(function(n){listEl.appendChild(renderItem(n));});
  }).catch(function(){emptyEl.style.display='block';emptyEl.textContent='加载失败';});
}

function renderItem(n){
  var item=document.createElement('div');
  item.className='item';
  var meta=document.createElement('div');
  meta.className='meta';
  meta.innerHTML='<span>'+fmt(n.ts)+'</span>'+(n.edited?'<span class="edited">· 已编辑</span>':'')+(n.replies&&n.replies.length?'<span>· '+n.replies.length+' 回复</span>':'');
  var content=document.createElement('div');
  content.className='content';
  content.textContent=n.content;
  var actions=document.createElement('div');
  actions.className='actions';
  var editBtn=document.createElement('button');
  editBtn.className='btn btn-ghost'; editBtn.textContent='编辑';
  var delBtn=document.createElement('button');
  delBtn.className='btn btn-danger'; delBtn.textContent='删除';
  actions.appendChild(editBtn); actions.appendChild(delBtn);
  item.appendChild(meta); item.appendChild(content); item.appendChild(actions);

  editBtn.addEventListener('click',function(){
    var ta=document.createElement('textarea');
    ta.value=n.content;
    item.replaceChild(ta,content);
    editBtn.textContent='保存'; delBtn.textContent='取消';
    editBtn.onclick=function(){
      var v=ta.value.trim();
      if(!v)return;
      fetch('/api/notes?id='+n.id,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-user':user,'x-admin-pass':pass},body:JSON.stringify({content:v})})
        .then(function(r){return r.json();}).then(function(upd){
          n.content=upd.content; n.edited=true;
          content.textContent=upd.content;
          item.replaceChild(content,ta);
          editBtn.textContent='编辑'; delBtn.textContent='删除';
          editBtn.onclick=null;
          meta.innerHTML='<span>'+fmt(n.ts)+'</span><span class="edited">· 已编辑</span>';
        });
    };
    delBtn.onclick=function(){
      item.replaceChild(content,ta);
      editBtn.textContent='编辑'; delBtn.textContent='删除';
      editBtn.onclick=null;
    };
  });

  delBtn.addEventListener('click',function(){
    if(!confirm('确定删除这条评论？'))return;
    fetch('/api/notes?id='+n.id,{method:'DELETE',headers:{'x-admin-user':user,'x-admin-pass':pass}})
      .then(function(r){return r.json();}).then(function(){
        item.remove();
        load();
      });
  });

  return item;
}

// =====================================================================
// 通用编辑器辅助
// =====================================================================
function val(id){var e=document.getElementById(id);return e?e.value:'';}
function setVal(id,v){var e=document.getElementById(id);if(e)e.value=v||'';}
function mkInput(type,value){
  var i=document.createElement('input'); i.type=type||'text'; i.value=value||'';
  return i;
}
function mkField(type,value,field){
  var i=mkInput(type,value); if(field) i.setAttribute('data-field',field); return i;
}
function fieldWrap(labelText, control){
  var d=document.createElement('div'); d.className='field';
  var l=document.createElement('label'); l.textContent=labelText;
  d.appendChild(l); d.appendChild(control);
  return d;
}
function showSaved(name){
  var h=document.getElementById('hint-'+name);
  if(!h)return;
  h.textContent='已保存 ✓'; h.style.opacity='1';
  setTimeout(function(){h.style.opacity='0';},2000);
}
// 保存内容页（PATCH /api/content?page=X，凭证走 x-admin-user / x-admin-pass，与碎碎念一致）
function saveContent(page, body){
  fetch('/api/content?page='+page, {
    method:'PATCH',
    headers:{'Content-Type':'application/json','x-admin-user':user,'x-admin-pass':pass},
    body:JSON.stringify(body)
  }).then(function(r){
    if(r.status===401){ alert('凭证失效，请刷新页面重新登录'); return; }
    if(!r.ok){ alert('保存失败（'+r.status+'）'); return; }
    showSaved(page);
  }).catch(function(){ alert('保存失败，请检查网络'); });
}

// =====================================================================
// 作品（works）
// =====================================================================
function loadWorks(){
  fetch('/api/content?page=works').then(function(r){return r.json();}).then(function(c){
    var projects=(c && Array.isArray(c.projects))? c.projects : [];
    renderWorks(projects);
  }).catch(function(){ renderWorks([]); });
}

// 上传作品 html 到 /api/work（凭证走 x-admin-user / x-admin-pass）
function uploadWork(html, onOk, onErr){
  fetch('/api/work', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-admin-user':user,'x-admin-pass':pass},
    body:JSON.stringify({ html:html })
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){
      if(res.ok && res.j && res.j.id) onOk(res.j.id);
      else onErr((res.j && res.j.error) ? res.j.error : '上传失败');
    })
    .catch(function(e){ onErr(String(e)); });
}

function renderWorks(projects){
  var wrap=document.getElementById('worksList');
  wrap.innerHTML='';
  document.getElementById('worksEmpty').style.display = projects.length? 'none':'block';
  projects.forEach(function(p){ wrap.appendChild(renderWorksCard(p)); });
}
function renderWorksCard(p){
  p=p||{};
  var card=document.createElement('div'); card.className='editor-card works-card';
  card.dataset.htmlId = p.htmlId||'';
  card.dataset.htmlUrl = p.htmlUrl||'';
  var head=document.createElement('div'); head.className='card-head';
  var title=document.createElement('span'); title.className='card-title'; title.textContent='作品';
  var del=document.createElement('button'); del.className='del'; del.textContent='删除';
  head.appendChild(title); head.appendChild(del);

  // 上传作品（html 视频）
  var up=document.createElement('div'); up.className='upload-block';
  var upLabel=document.createElement('label'); upLabel.textContent='上传作品（.html 视频）';
  var ubRow=document.createElement('div'); ubRow.className='ub-row';
  var fileInput=document.createElement('input'); fileInput.type='file'; fileInput.accept='.html,text/html';
  var upBtn=document.createElement('button'); upBtn.className='up-btn'; upBtn.textContent='上传';
  var upStatus=document.createElement('span'); upStatus.className='up-status';
  ubRow.appendChild(fileInput); ubRow.appendChild(upBtn); ubRow.appendChild(upStatus);
  up.appendChild(upLabel); up.appendChild(ubRow);
  if(card.dataset.htmlId) upStatus.innerHTML='已上传 ✓ <span class="ok">('+card.dataset.htmlId.slice(0,6)+')</span>';
  upBtn.addEventListener('click', function(){
    var file=fileInput.files[0];
    if(!file){ upStatus.textContent='请先选择 .html 文件'; return; }
    var reader=new FileReader();
    reader.onload=function(){
      uploadWork(reader.result, function(id){
        card.dataset.htmlId=id; card.dataset.htmlUrl='';
        upStatus.innerHTML='已上传 ✓ <span class="ok">('+id.slice(0,6)+')</span>';
      }, function(err){ upStatus.textContent='上传失败: '+err; });
    };
    reader.readAsText(file);
  });

  var f_title=fieldWrap('标题', mkField('text', p.title||'', 'title'));
  var f_client=fieldWrap('客户 / 署名', mkField('text', p.client||'', 'client'));
  var f_desc=fieldWrap('描述', mkField('text', p.desc||'', 'desc'));
  var f_tags=fieldWrap('标签（逗号分隔）', mkField('text', (p.tags||[]).join(', '), 'tags'));
  var f_url=fieldWrap('或粘贴作品 URL（与上传二选一）', mkField('text', p.htmlUrl||'', 'htmlUrl'));
  f_url.querySelector('input').addEventListener('input', function(e){
    card.dataset.htmlUrl=e.target.value.trim();
    if(card.dataset.htmlUrl){ card.dataset.htmlId=''; upStatus.textContent='使用粘贴的 URL'; }
  });
  var cDark=fieldWrap('深色背景', mkField('color', p.colorDark||'#2d1b69', 'colorDark'));
  var cLight=fieldWrap('浅色背景', mkField('color', p.colorLight||'#e8dff5', 'colorLight'));
  var f_colors=document.createElement('div'); f_colors.className='row2';
  var a=document.createElement('div'); a.appendChild(cDark);
  var b=document.createElement('div'); b.appendChild(cLight);
  f_colors.appendChild(a); f_colors.appendChild(b);
  card.appendChild(head);
  card.appendChild(up);
  card.appendChild(f_title); card.appendChild(f_client); card.appendChild(f_desc);
  card.appendChild(f_tags); card.appendChild(f_url); card.appendChild(f_colors);
  del.addEventListener('click',function(){ card.remove(); updateEmptyState('worksList','worksEmpty'); });
  return card;
}
function saveWorks(){
  var cards=document.querySelectorAll('#worksList .works-card');
  var projects=[];
  cards.forEach(function(card){
    var g=function(f){ var el=card.querySelector('[data-field="'+f+'"]'); return el? el.value : ''; };
    var t=g('title').trim();
    var c=g('client').trim();
    var d=g('desc').trim();
    var tags=g('tags').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
    var colorDark=g('colorDark'); var colorLight=g('colorLight');
    var htmlUrl=(card.dataset.htmlUrl || g('htmlUrl')).trim();
    var htmlId=card.dataset.htmlId||'';
    var obj={ title:t, client:c||t, desc:d, tags:tags, colorDark:colorDark, colorLight:colorLight };
    if(htmlUrl) obj.htmlUrl=htmlUrl; else if(htmlId) obj.htmlId=htmlId;
    projects.push(obj);
  });
  saveContent('works', { projects:projects });
}
function updateEmptyState(listId, emptyId){
  var has=document.getElementById(listId).children.length>0;
  document.getElementById(emptyId).style.display = has? 'none':'block';
}

// =====================================================================
// 首页（index / hero）
// =====================================================================
function loadIndex(){
  fetch('/api/content?page=index').then(function(r){return r.json();}).then(function(c){
    c=c||{}; var hero=c.hero||{};
    setVal('idx_eyebrow', hero.eyebrow||'');
    setVal('idx_title', hero.title||'');
    setVal('idx_subtitle', hero.subtitle||'');
    setVal('idx_intro', hero.intro||'');
    document.getElementById('idx_socials').innerHTML='';
    (hero.socials||[]).forEach(function(s){ appendSocialRow(s); });
  }).catch(function(){});
}
function appendSocialRow(s){
  s=s||{};
  var row=document.createElement('div'); row.className='editor-card soc-row'; row.style.marginBottom='10px';
  var r2=document.createElement('div'); r2.className='row2';
  var a=document.createElement('div'); var la=document.createElement('label'); la.textContent='名称';
  var i1=mkInput('text', s.label||''); a.appendChild(la); a.appendChild(i1);
  var b=document.createElement('div'); var lb=document.createElement('label'); lb.textContent='链接';
  var i2=mkInput('text', s.url||''); b.appendChild(lb); b.appendChild(i2);
  r2.appendChild(a); r2.appendChild(b);
  var del=document.createElement('button'); del.className='del'; del.textContent='删除'; del.style.marginTop='8px';
  del.addEventListener('click',function(){ row.remove(); });
  row.appendChild(r2); row.appendChild(del);
  document.getElementById('idx_socials').appendChild(row);
}
function saveIndex(){
  var socials=[];
  document.querySelectorAll('#idx_socials .soc-row').forEach(function(row){
    var ins=row.querySelectorAll('input');
    var label=ins[0].value.trim(), url=ins[1].value.trim();
    if(label||url) socials.push({label:label, url:url});
  });
  saveContent('index', {
    hero: {
      eyebrow: val('idx_eyebrow'),
      title: val('idx_title'),
      subtitle: val('idx_subtitle'),
      intro: val('idx_intro'),
      socials: socials
    }
  });
}

// =====================================================================
// 关于（about）
// =====================================================================
function loadAbout(){
  fetch('/api/content?page=about').then(function(r){return r.json();}).then(function(a){
    a=a||{};
    document.getElementById('abt_bio').innerHTML='';
    (a.bio||[]).forEach(function(t){ appendBioRow(t); });
    setVal('abt_skills', (a.skills||[]).join(', '));
    document.getElementById('abt_contact').innerHTML='';
    (a.contact||[]).forEach(function(c){ appendContactRow(c); });
  }).catch(function(){});
}
function appendBioRow(text){
  var row=document.createElement('div'); row.className='editor-card bio-row'; row.style.marginBottom='10px';
  var ta=document.createElement('textarea'); ta.rows=2; ta.value=text||'';
  var del=document.createElement('button'); del.className='del'; del.textContent='删除'; del.style.marginTop='8px';
  del.addEventListener('click',function(){ row.remove(); });
  row.appendChild(ta); row.appendChild(del);
  document.getElementById('abt_bio').appendChild(row);
}
function appendContactRow(c){
  c=c||{};
  var row=document.createElement('div'); row.className='editor-card ct-row'; row.style.marginBottom='10px';
  var r2=document.createElement('div'); r2.className='row2';
  var a=document.createElement('div'); var la=document.createElement('label'); la.textContent='标签';
  var i1=mkInput('text', c.label||''); a.appendChild(la); a.appendChild(i1);
  var b=document.createElement('div'); var lb=document.createElement('label'); lb.textContent='内容';
  var i2=mkInput('text', c.value||''); b.appendChild(lb); b.appendChild(i2);
  r2.appendChild(a); r2.appendChild(b);
  var c3=document.createElement('div'); var lc=document.createElement('label'); lc.textContent='链接（可空）';
  var i3=mkInput('text', c.url||''); c3.appendChild(lc); c3.appendChild(i3);
  var del=document.createElement('button'); del.className='del'; del.textContent='删除'; del.style.marginTop='8px';
  del.addEventListener('click',function(){ row.remove(); });
  row.appendChild(r2); row.appendChild(c3); row.appendChild(del);
  document.getElementById('abt_contact').appendChild(row);
}
function saveAbout(){
  var bio=[];
  document.querySelectorAll('#abt_bio .bio-row').forEach(function(row){
    var v=row.querySelector('textarea').value.trim();
    if(v) bio.push(v);
  });
  var skills=val('abt_skills').split(',').map(function(s){return s.trim();}).filter(Boolean);
  var contact=[];
  document.querySelectorAll('#abt_contact .ct-row').forEach(function(row){
    var ins=row.querySelectorAll('input');
    var label=ins[0].value.trim(), value=ins[1].value.trim(), url=ins[2].value.trim();
    if(label||value){
      var obj={label:label, value:value};
      if(url) obj.url=url;
      contact.push(obj);
    }
  });
  saveContent('about', { bio:bio, skills:skills, contact:contact });
}

// ===== 编辑器按钮绑定 =====
document.getElementById('worksAdd').addEventListener('click',function(){
  document.getElementById('worksList').appendChild(renderWorksCard({}));
  updateEmptyState('worksList','worksEmpty');
});
document.getElementById('worksSave').addEventListener('click',saveWorks);
document.getElementById('indexSave').addEventListener('click',saveIndex);
document.getElementById('aboutSave').addEventListener('click',saveAbout);
document.getElementById('idx_socAdd').addEventListener('click',function(){ appendSocialRow({}); });
document.getElementById('abt_bioAdd').addEventListener('click',function(){ appendBioRow(''); });
document.getElementById('abt_ctAdd').addEventListener('click',function(){ appendContactRow({}); });
</script>
