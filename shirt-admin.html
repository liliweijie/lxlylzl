<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Shirt 定制后台</title>
<style>
:root{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#010101;background:#f1f1f1;line-height:1.55;--paper:#fff;--muted:#575757;--line:#c9c9c9;--accent:#ff1111}
*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}a{color:inherit}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid #cf1515;outline-offset:3px}button:disabled{opacity:.5;cursor:default}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px max(4vw,16px);border-bottom:1px solid var(--line)}header a{text-decoration:none}main{max-width:1120px;margin:auto;padding:clamp(22px,5vw,58px) 18px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(26px,4vw,42px);line-height:1.13;margin-bottom:14px}h2{font-size:18px}h3{font-size:14px}
button,.file-link{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:7px 13px;background:var(--paper);border:1px solid var(--line);border-radius:5px;color:#010101;text-decoration:none;font-size:13px;font-weight:640}.primary{background:var(--accent);border-color:var(--accent)}
.login{max-width:390px;margin:24px auto;padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:9px}.login form{display:grid;gap:12px}.login label{display:grid;gap:4px;font-size:14px}.login input{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:5px}.status{color:var(--muted);font-size:13px;margin-top:8px}.status:empty{display:none}
.list-head,.order-summary,.pager{display:flex;align-items:center;justify-content:space-between;gap:12px}.order-list{list-style:none;margin:12px 0;padding:0;display:grid;gap:8px}.order{background:var(--paper);border:1px solid var(--line);border-radius:7px;overflow:hidden}.order summary{cursor:pointer;padding:14px 16px}.order-summary{display:inline-flex;width:calc(100% - 22px);vertical-align:middle}.order-summary span{color:var(--muted);font-size:13px}.order-summary strong,.order-summary b{font-variant-numeric:tabular-nums}.order-details{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:16px;border-top:1px solid var(--line)}.order-details p{font-size:14px;margin:5px 0;overflow-wrap:anywhere}.order-assets{grid-column:1/-1;min-width:0}.assets{display:flex;flex-wrap:wrap;gap:12px}.asset{margin:0;display:grid;justify-items:start;align-content:start;gap:6px;min-width:0}.asset img{width:140px;height:108px;object-fit:contain;background:#e7e7e7;border:1px solid var(--line);border-radius:5px}.asset figcaption{font-size:13px}.file-link{max-width:100%;overflow-wrap:anywhere}.pager button{font-size:13px}.order-status{display:block;font-size:12px;color:var(--muted)}
@media(max-width:620px){.order-details{grid-template-columns:minmax(0,1fr)}.order-summary{flex-wrap:wrap;row-gap:3px}.order-summary span{order:3;width:100%}}
</style>
<script src="/js/shirt-admin.js?v=1" defer></script>
</head>
<body>
<header><a href="/shirt">← Shirt 定制</a><button id="logout" type="button" hidden>退出登录</button></header>
<main>
  <section class="login" id="login" aria-labelledby="login-title" hidden>
    <h1 id="login-title">定制后台</h1>
    <form id="login-form">
      <label>管理员账号<input name="username" autocomplete="username" maxlength="150" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" maxlength="240" required></label>
      <button class="primary" type="submit">登录</button>
    </form>
    <p class="status" id="login-status" role="status"></p>
  </section>
  <section id="workspace" aria-labelledby="dashboard-title" hidden>
    <div class="list-head"><h1 id="dashboard-title">定制订单</h1><button id="refresh-orders" type="button">刷新</button></div>
    <p class="status" id="orders-status" role="status"></p>
    <ul class="order-list" id="orders"></ul>
    <div class="pager" id="pager" hidden><button type="button" id="previous">上一页</button><button type="button" id="next">下一页</button></div>
  </section>
</main>
</body>
</html>
