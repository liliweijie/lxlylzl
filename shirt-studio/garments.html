<script>const themeStorageKey='print-lab-theme';
const systemTheme=matchMedia('(prefers-color-scheme: dark)');
let savedTheme;
try {
  const value=localStorage.getItem(themeStorageKey);
  if(value==='light'||value==='dark') savedTheme=value;
} catch {}

function applyTheme(theme){
  document.documentElement.dataset.theme=theme;
  document.querySelectorAll('[data-theme-toggle]').forEach(button=>{
    button.setAttribute('aria-pressed',String(theme==='dark'));
  });
}
applyTheme(savedTheme??(systemTheme.matches?'dark':'light'));
document.addEventListener('DOMContentLoaded',()=>applyTheme(document.documentElement.dataset.theme),{once:true});
systemTheme.addEventListener('change',event=>{
  if(!savedTheme) applyTheme(event.matches?'dark':'light');
});
document.addEventListener('click',event=>{
  if(!event.target.closest('[data-theme-toggle]')) return;
  savedTheme=document.documentElement.dataset.theme==='dark'?'light':'dark';
  applyTheme(savedTheme);
  try { localStorage.setItem(themeStorageKey,savedTheme); } catch {}
});
</script>
<style>:root{
  color-scheme:light;
  --white:#f1f1f1;
  --black:#010101;
  --red:#ff1111;
  --gray:#202020;
  --paper:var(--white);
  --ink:var(--black);
  --accent:var(--red);
  --accent-text:var(--black);
  --accent-ink:#c60000;
  --muted:color-mix(in srgb,var(--ink) 63%,var(--paper));
  --line:color-mix(in srgb,var(--ink) 23%,var(--paper));
  --panel:var(--white);
  --hover:color-mix(in srgb,var(--paper) 94%,var(--ink));
  --stage-focus:#f1f1f1;
  --stage-edge:#c6c6c6;
  --stage-top:#ebebeb;
  --stage-floor:#77777724;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --paper:var(--black);
  --ink:var(--white);
  --muted:color-mix(in srgb,var(--ink) 65%,var(--gray));
  --line:color-mix(in srgb,var(--ink) 20%,var(--gray));
  --panel:var(--gray);
  --hover:color-mix(in srgb,var(--gray) 85%,var(--ink));
  --stage-focus:#333333;
  --stage-edge:#010101;
  --stage-top:#202020;
  --stage-floor:#00000078;
  --accent-ink:#ff6464;
}
.theme-toggle{display:grid;place-items:center;flex:none;min-width:36px;min-height:34px;padding:6px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:5px}
.theme-toggle svg{width:17px;height:17px;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.theme-toggle:hover{background:var(--hover)}
:root[data-theme=dark] .theme-moon,:root:not([data-theme=dark]) .theme-sun{display:none}
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--panel);color-scheme:light;--line:#dad9d6;--mute:#656460;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}body{margin:0}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible,.stage:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.site-nav{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(21px,3.3vw,52px);font-size:13px}
.back{display:inline-flex;align-items:center;gap:12px;padding:10px 0}.back:hover{text-decoration:underline;text-underline-offset:5px}.back span{font-size:19px}.step,.label,.details-head span,.tick{font:11px/1.3 ui-monospace,monospace;letter-spacing:.09em}.step{color:var(--mute)}.step-id{color:var(--ink)}
.frame{display:grid;grid-template-columns:minmax(0,1fr) clamp(290px,24vw,390px);min-height:480px;height:calc(100svh - 70px)}
.gallery{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0;isolation:isolate;overflow:hidden}
.intro{padding:clamp(24px,4.7vh,55px) 0 0 clamp(24px,3.6vw,56px);position:relative;z-index:2}.intro h1{font-weight:430;font-size:clamp(32px,3.25vw,52px);line-height:1.12;letter-spacing:-.055em;margin:0}.intro p{font-size:12px;color:var(--mute);margin:12px 0 0}
.stage{position:relative;min-height:0;touch-action:pan-y;user-select:none;cursor:grab;overflow:hidden;outline-offset:-3px!important;background:radial-gradient(ellipse at 50% 58%,var(--stage-focus),var(--paper) 76%)}
.stage.dragging{cursor:grabbing}.stage.dragging .actor{cursor:grabbing;pointer-events:none!important}.figures{position:absolute;inset:0}
.actor{position:absolute;bottom:0;left:0;display:block;width:var(--art-size,360px);aspect-ratio:1;opacity:0;transform-origin:50% 100%;user-select:none;will-change:transform,opacity;isolation:isolate;cursor:pointer}
.actor img{position:relative;display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:1}
.actor::after{content:"";position:absolute;bottom:4%;left:14%;right:14%;height:10%;background:radial-gradient(closest-side,#3f3b352f,#514d4620 35%,transparent 83%);transform:scaleY(.55);filter:blur(4px);z-index:0}
.actor:focus-visible{outline-offset:-15px;border-radius:16px}
.controls{display:flex;gap:clamp(7px,1.35vw,22px);align-items:center;min-width:0;padding:9px clamp(15px,3vw,46px) clamp(15px,3.2vh,36px)}
.step-button{border:0;background:transparent;display:grid;place-items:center;width:44px;min-width:36px;height:44px;padding:0;border-radius:50%;transition:background .25s}
.step-button:hover{background:var(--hover)}.step-button svg{width:24px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}.step-button.autoplay svg{width:15px;stroke-width:1.5}.autoplay .icon-play,.autoplay[data-paused] .icon-pause{display:none}.autoplay[data-paused] .icon-play{display:block}
.ticks{display:flex;flex:1;gap:6px;min-width:0}.tick{display:grid;gap:7px;text-align:left;min-width:0;align-content:center;height:44px;flex:0 1 38px;border:0;padding:0;background:none;color:var(--mute);transition:flex-basis .6s var(--ease)}.tick[aria-current=true]{flex-basis:171px;color:var(--ink)}.tick[aria-current=true] .bar::after{background:var(--accent)}.tick-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tick .tick-name{display:none}.tick[aria-current=true] .tick-name{display:inline}.bar{height:2px;background:var(--line);position:relative}.bar::after{content:"";position:absolute;inset:0;background:currentColor;transform:scaleX(0);transform-origin:left}.tick[aria-current=true] .bar::after{transform:scaleX(var(--progress,1))}
.details{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}.details-body{padding:clamp(20px,4.6vh,48px) clamp(18px,2.1vw,32px);overflow:auto;flex:1}
.details-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:19px;margin:0}.details-head h2{font-size:16px;font-weight:500;margin:0}.details-head span,.label,.description,.zones,.details-foot p{color:var(--mute)}
.detail-product{display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.detail-product img{width:100%;height:auto;display:block;background:var(--panel)}
.label{margin:0 0 4px}.detail-product h3{font-weight:560;font-size:17px;margin:0}.description{font-size:12px;line-height:1.55;margin:6px 0 0}
.details-section{padding:18px 0;border-bottom:1px solid var(--line)}.details-section h3{font-weight:500;font-size:13px;margin:0 0 11px}
.views{display:grid;grid-template-columns:1fr 1fr;gap:7px}.views button{padding:8px 6px;border:1px solid var(--line);background:var(--panel);font-size:12px}.views button[aria-pressed=true]{border-color:var(--accent);background:var(--hover)}.zones{font-size:12px;margin:0;line-height:1.7}.zones span{margin:0 .4em;color:var(--muted)}
.details-foot{border-top:1px solid var(--line);padding:17px clamp(18px,2.1vw,32px) 22px}.primary{min-height:49px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;gap:13px;font-size:13px}.primary:hover{background:var(--accent);color:var(--accent-text)}.primary span{font-size:16px}
.details-foot p{font-size:11px;margin:11px 0 0;line-height:1.5;text-align:center}.sr{width:1px;height:1px;position:absolute;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:740px){
 .site-nav{height:54px}.frame{height:auto;min-height:unset;grid-template-columns:minmax(0,1fr)}
 .gallery{height:clamp(370px,64svh,620px)}.intro{padding-top:20px}.intro p{margin-top:8px}
 .controls{padding:3px 12px 7px}.tick[aria-current=true]{flex-basis:104px}.details{border-left:none;border-top:1px solid var(--line)}
 .details-body{padding:18px 20px 3px}.details-head{padding-bottom:12px}.detail-product{padding:12px 0;grid-template-columns:64px 1fr}

 .details-foot{padding:12px 20px 16px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}

.nav-actions{display:flex;align-items:center;gap:14px}
.saved-nav{padding:8px 0}.saved-nav:hover{text-decoration:underline;text-underline-offset:4px}
.saved{min-height:44svh;padding:clamp(28px,5vw,58px) clamp(21px,3.6vw,56px)}
.saved h1{font-size:clamp(30px,3.25vw,52px);font-weight:490;letter-spacing:-.04em;margin:0}

.design-card{border:1px solid var(--line);min-width:0;display:flex;flex-direction:column;border-radius:6px;overflow:hidden}

.design-quantities span{white-space:nowrap}
