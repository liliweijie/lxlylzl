<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="核对定制服装、印花、尺码与数量。">
<title>定制结算 · 3D 试衣</title>
<script>const themeStorageKey='print-lab-theme';
const systemTheme=matchMedia('(prefers-color-scheme: dark)');
let savedTheme;
try {
  const value=localStorage.getItem(themeStorageKey);
  if(value==='light'||value==='dark') savedTheme=value;
} catch {}

function applyTheme(theme){
  document.documentElement.dataset.theme=theme;
  document.querySelectorAll('[data-theme-toggle]').forEach(button=>{
    button.setAttribute('aria-pressed',String(theme==='dark'));
  });
}
applyTheme(savedTheme??(systemTheme.matches?'dark':'light'));
document.addEventListener('DOMContentLoaded',()=>applyTheme(document.documentElement.dataset.theme),{once:true});
systemTheme.addEventListener('change',event=>{
  if(!savedTheme) applyTheme(event.matches?'dark':'light');
});
document.addEventListener('click',event=>{
  if(!event.target.closest('[data-theme-toggle]')) return;
  savedTheme=document.documentElement.dataset.theme==='dark'?'light':'dark';
  applyTheme(savedTheme);
  try { localStorage.setItem(themeStorageKey,savedTheme); } catch {}
});

window.addEventListener('storage',event=>{
  if(event.key!==themeStorageKey) return;
  savedTheme=event.newValue==='light'||event.newValue==='dark'?event.newValue:undefined;
  applyTheme(savedTheme??(systemTheme.matches?'dark':'light'));
});
</script>
<style>:root{
  color-scheme:light;
  --white:#f1f1f1;
  --black:#010101;
  --red:#ff1111;
  --gray:#202020;
  --paper:var(--white);
  --ink:var(--black);
  --accent:var(--red);
  --accent-text:var(--black);
  --accent-ink:#c60000;
  --muted:color-mix(in srgb,var(--ink) 63%,var(--paper));
  --line:color-mix(in srgb,var(--ink) 23%,var(--paper));
  --panel:var(--white);
  --hover:color-mix(in srgb,var(--paper) 94%,var(--ink));
  --stage-focus:#f1f1f1;
  --stage-edge:#c6c6c6;
  --stage-top:#ebebeb;
  --stage-floor:#77777724;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --paper:var(--black);
  --ink:var(--white);
  --muted:color-mix(in srgb,var(--ink) 65%,var(--gray));
  --line:color-mix(in srgb,var(--ink) 20%,var(--gray));
  --panel:var(--gray);
  --hover:color-mix(in srgb,var(--gray) 85%,var(--ink));
  --stage-focus:#333333;
  --stage-edge:#010101;
  --stage-top:#202020;
  --stage-floor:#00000078;
  --accent-ink:#ff6464;
}
.theme-toggle{display:grid;place-items:center;flex:none;min-width:36px;min-height:34px;padding:6px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:5px}
.theme-toggle svg{width:17px;height:17px;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.theme-toggle:hover{background:var(--hover)}
:root[data-theme=dark] .theme-moon,:root:not([data-theme=dark]) .theme-sun{display:none}
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--panel)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
button,a{-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.32;cursor:default}
button:focus-visible,a:focus-visible,iframe:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.site-nav{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3.6vw,56px);font-size:13px}
.back{display:inline-flex;align-items:center;gap:10px;padding:10px 0}
.back:hover,.secondary:hover{text-decoration:underline;text-underline-offset:4px}
.back span{font-size:19px}
.saved,.checkout{padding:clamp(22px,3.5vw,47px) clamp(16px,3.6vw,56px)}
.saved h1,.checkout h1{font-size:clamp(28px,3.35vw,48px);font-weight:570;letter-spacing:-.045em;margin:0}
.saved-status,.checkout-status{font-size:13px;color:var(--muted);margin:7px 0 18px}
.showcase,.checkout-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,29%);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.model-stage{position:relative;height:clamp(330px,48svh,530px);background:radial-gradient(var(--stage-focus),var(--paper))}
.model-stage iframe{display:block;width:100%;height:100%;border:0}
.model-stage p{position:absolute;bottom:12px;left:12px;padding:6px 8px;margin:0;background:color-mix(in srgb,var(--panel) 80%,transparent);border-radius:4px;font-size:11px;color:var(--muted);pointer-events:none}
.selection,.order-details{padding:clamp(18px,2.4vw,32px);border-left:1px solid var(--line)}
.selection{display:flex;flex-direction:column;justify-content:center}
.selection h2,.order-details h2{font-size:clamp(18px,1.9vw,27px);font-weight:620;letter-spacing:-.02em;margin:0}
.selection-meta{display:grid;gap:4px;font-size:13px;color:var(--muted);margin:10px 0 19px;line-height:1.5}
#selected-price{color:var(--ink);font-weight:640;font-variant-numeric:tabular-nums}
.selection-total{display:grid;gap:1px;margin-top:6px}
.selection-total strong{font-size:clamp(16px,2vw,24px);line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.selection-actions{display:grid;gap:9px}
.primary{min-height:42px;padding:8px 13px;border-radius:5px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--accent);color:var(--accent-text);font-size:14px;font-weight:680;white-space:nowrap}
.primary:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.secondary{display:inline-flex;align-items:center;min-height:29px;font-size:12px;color:var(--muted);width:max-content}
.rail{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;margin-top:12px}
.rail-step{border:1px solid var(--line);border-radius:50%;background:var(--paper);width:32px;height:32px;padding:0}
.rail-step:hover:not(:disabled){border-color:var(--accent)}
.saved-grid{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(100px,13vw,168px);gap:10px;padding:3px 3px 10px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:thin}
.saved-grid>[role=listitem]{min-width:0;scroll-snap-align:start}
.design-card{width:100%;height:100%;display:flex;flex-direction:column;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper);text-align:left}
.design-card:hover,.design-card[aria-pressed=true]{border-color:var(--accent)}
.design-card[aria-pressed=true] .card-name{color:var(--accent-ink)}
.design-card img{display:block;width:100%;height:auto;aspect-ratio:1.35;object-fit:contain;background:radial-gradient(var(--stage-focus),var(--paper))}
.card-name{padding:7px 7px 8px;font-size:11px;font-weight:630;overflow-wrap:anywhere}
.checkout-layout{grid-template-columns:minmax(0,1fr) minmax(280px,42%);margin-top:20px;max-width:1080px}
.checkout-photo{display:grid;place-items:center;min-height:290px;background:radial-gradient(var(--stage-focus),var(--paper))}
.checkout-photo iframe{width:100%;height:100%;min-height:290px;border:0}
.checkout-photo img{display:block;width:min(100%,490px);height:auto;object-fit:contain}
.order-specs,.order-total{display:grid;gap:10px;margin:15px 0;padding:15px 0;border-top:1px solid var(--line);font-size:13px}
.order-specs div,.order-total div{display:flex;justify-content:space-between;align-items:center;gap:15px}
.order-specs dt,.order-total dt,.order-sizes p{color:var(--muted)}
.order-specs dd,.order-total dd{margin:0;text-align:right}
.order-swatch{display:inline-block;width:13px;height:13px;border:1px solid var(--line);border-radius:50%;margin-right:7px;vertical-align:-2px}
.order-sizes{border-top:1px solid var(--line);padding-top:15px}
.order-sizes h3{font-size:13px;font-weight:640;margin:0}
.order-sizes ul{display:flex;flex-wrap:wrap;gap:7px;list-style:none;margin:10px 0;padding:0}
.order-sizes li{border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:13px}
.order-sizes p{font-size:12px;margin:7px 0}
.order-total{margin:12px 0 0;padding-bottom:0}
.order-total dd{font-weight:650}
.order-total .order-grand-total{border-top:1px solid var(--line);padding-top:10px}
.order-grand-total dd{font-size:18px}
@media(max-width:740px){
 .site-nav{height:49px}
 .saved,.checkout{padding-block:18px}
 .saved-status{margin-bottom:13px}
 .showcase,.checkout-layout{grid-template-columns:minmax(0,1fr)}
 .model-stage{height:clamp(226px,36svh,340px)}
 .selection,.order-details{padding:13px;border-left:0;border-top:1px solid var(--line)}
 .selection{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center}
 .selection-meta{margin:3px 0 0;font-size:12px}
 .selection-actions{grid-column:2;grid-row:1/3;justify-items:end;gap:1px}
 .selection-actions .primary{min-height:37px}
 .selection-actions .secondary{min-height:24px}
 .rail{margin-top:8px;gap:4px}
 .rail-step{width:28px;height:28px}
 .saved-grid{grid-auto-columns:clamp(83px,27vw,137px);gap:7px}
 .checkout-photo{min-height:0}
 .checkout-photo img{width:min(100%,310px)}
}
</style>
</head>
<body>
<header class="site-nav">
  <a class="back" id="back-to-designs" href="./customizations.html"><span aria-hidden="true">←</span> 返回我的定制</a>
  <button type="button" class="theme-toggle" data-theme-toggle aria-label="切换明暗模式" title="切换明暗模式"><svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 15A8.9 8.9 0 0 1 9 3.3 9 9 0 1 0 20.7 15Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M5 5l1.5 1.5m11 11L19 19M2 12h2m16 0h2M5 19l1.5-1.5m11-11L19 5"/></svg></button>
</header>
<main class="checkout">
  <h1>定制结算</h1>
  <p class="checkout-status" id="checkout-status" role="status">正在读取定制…</p>
  <div class="checkout-layout" id="checkout-layout" hidden>
    <div class="checkout-photo">
      <img id="checkout-preview" width="384" height="384" alt="已保存的服装预览" hidden>
      <iframe id="checkout-live-preview" title="当前可印花款式预览" hidden></iframe>
    </div>
    <section class="order-details" aria-labelledby="order-title">
      <h2 id="order-title"></h2>
      <dl class="order-specs">
        <div><dt>服装单价</dt><dd id="order-price"></dd></div>
        <div><dt>颜色</dt><dd id="order-color"></dd></div>
        <div><dt>印花</dt><dd id="order-print"></dd></div>
      </dl>
      <div class="order-sizes">
        <h3>尺码与数量</h3>
        <ul id="order-sizes"></ul>
        <p id="empty-sizes" hidden>请先选择尺码和数量。</p>
        <a class="secondary" id="edit-order">调整定制</a>
      </div>
      <dl class="order-total">
        <div><dt>合计件数</dt><dd id="order-count"></dd></div>
        <div id="order-discount-row" hidden><dt>服装折扣</dt><dd id="order-discount"></dd></div>
        <div><dt>服装小计</dt><dd id="order-apparel-subtotal"></dd></div>
        <div><dt>印花小计</dt><dd id="order-print-subtotal"></dd></div>
        <div class="order-grand-total"><dt>定制总价</dt><dd id="order-grand-total"></dd></div>
      </dl>
    </section>
  </div>
</main>
