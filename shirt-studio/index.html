<meta name="female-fit-attribution" content="Free Female Mannequin Base Mesh by Devlane (https://sketchfab.com/3d-models/free-female-mannequin-base-mesh-187300a221c04178b96b84bf9cab97e0), Sketchfab Standard, adapted pose.">
<title>3D 试衣</title>
<script>const themeStorageKey='print-lab-theme';
const systemTheme=matchMedia('(prefers-color-scheme: dark)');
let savedTheme;
try {
  const value=localStorage.getItem(themeStorageKey);
  if(value==='light'||value==='dark') savedTheme=value;
} catch {}

function applyTheme(theme){
  document.documentElement.dataset.theme=theme;
  document.querySelectorAll('[data-theme-toggle]').forEach(button=>{
    button.setAttribute('aria-pressed',String(theme==='dark'));
  });
}
applyTheme(savedTheme??(systemTheme.matches?'dark':'light'));
document.addEventListener('DOMContentLoaded',()=>applyTheme(document.documentElement.dataset.theme),{once:true});
systemTheme.addEventListener('change',event=>{
  if(!savedTheme) applyTheme(event.matches?'dark':'light');
});
document.addEventListener('click',event=>{
  if(!event.target.closest('[data-theme-toggle]')) return;
  savedTheme=document.documentElement.dataset.theme==='dark'?'light':'dark';
  applyTheme(savedTheme);
  try { localStorage.setItem(themeStorageKey,savedTheme); } catch {}
});
</script>
<style>:root{
  color-scheme:light;
  --white:#f1f1f1;
  --black:#010101;
  --red:#ff1111;
  --gray:#202020;
  --paper:var(--white);
  --ink:var(--black);
  --accent:var(--red);
  --accent-text:var(--black);
  --accent-ink:#c60000;
  --muted:color-mix(in srgb,var(--ink) 63%,var(--paper));
  --line:color-mix(in srgb,var(--ink) 23%,var(--paper));
  --panel:var(--white);
  --hover:color-mix(in srgb,var(--paper) 94%,var(--ink));
  --stage-focus:#f1f1f1;
  --stage-edge:#c6c6c6;
  --stage-top:#ebebeb;
  --stage-floor:#77777724;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --paper:var(--black);
  --ink:var(--white);
  --muted:color-mix(in srgb,var(--ink) 65%,var(--gray));
  --line:color-mix(in srgb,var(--ink) 20%,var(--gray));
  --panel:var(--gray);
  --hover:color-mix(in srgb,var(--gray) 85%,var(--ink));
  --stage-focus:#333333;
  --stage-edge:#010101;
  --stage-top:#202020;
  --stage-floor:#00000078;
  --accent-ink:#ff6464;
}
.theme-toggle{display:grid;place-items:center;flex:none;min-width:36px;min-height:34px;padding:6px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:5px}
.theme-toggle svg{width:17px;height:17px;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.theme-toggle:hover{background:var(--hover)}
:root[data-theme=dark] .theme-moon,:root:not([data-theme=dark]) .theme-sun{display:none}
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
button,input,textarea,select{font:inherit}
button{color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,#viewport:focus-visible,.upload:focus-within{outline:2px solid var(--accent);outline-offset:3px}
button,select{background:transparent}
button:hover:not(:disabled){border-color:var(--accent)}
svg{width:18px;height:18px;display:block;flex:none}
i[data-icon]{display:inline-flex;font-style:normal}
.stage-top button,.edit-trigger,.drag-tip,.quiet,.accent{display:flex;align-items:center;gap:8px}
body{overflow:hidden}
.studio{--editor-width:405px;--editor-gap:12px;--view-right:0px;--view-bottom:0px;--slide:460ms cubic-bezier(.22,1,.36,1);position:relative;width:100%;height:100dvh;overflow:hidden;background:var(--paper)}
.stage{position:absolute;inset:0;overflow:hidden}
.editor-active{--view-right:calc(var(--editor-width) + 2 * var(--editor-gap))}
#viewport{position:absolute;inset:0 var(--view-right) var(--view-bottom) 0;touch-action:none;cursor:grab;outline-offset:-5px;transition:right var(--slide),bottom var(--slide)}
#viewport.dragging{cursor:grabbing}
#viewport.print-hover{cursor:move}
#viewport.print-dragging{cursor:grabbing}
#viewport canvas{display:block;width:100%;height:100%}
.stage-top,.stage-bottom{position:absolute;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.stage-top{top:18px}
.stage-bottom{bottom:18px;right:calc(20px + var(--view-right));transition:right var(--slide)}
.stage-top button,.stage-bottom button{pointer-events:auto}
.drag-tip,.quiet{font-size:12px}
.drag-tip{color:var(--muted)}
.quiet,.icon-button{border:1px solid var(--line);border-radius:5px;padding:8px 11px}
.quiet{background:var(--panel)}
.views{display:flex;position:absolute;left:50%;transform:translateX(-50%);background:var(--paper);border:1px solid var(--line);overflow:hidden;border-radius:6px}
.views button{min-width:51px;padding:7px 11px;border:0;border-right:1px solid var(--line);font-size:13px}
.views button:last-child{border-right:0}
.views button[aria-pressed=true],.zones button[aria-pressed=true],.accent{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.edit-trigger{padding:8px 11px;background:var(--panel);border:1px solid var(--line);border-radius:5px;font-size:12px}
.editor{background:color-mix(in srgb,var(--panel) 80%,transparent);backdrop-filter:blur(18px);color:var(--ink);width:var(--editor-width);max-width:none;max-height:calc(100% - 2 * var(--editor-gap));margin:0;inset:var(--editor-gap) var(--editor-gap) auto auto;border:1px solid var(--line);border-radius:7px;padding:15px 17px 17px;box-shadow:0 16px 50px #01010129;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;transform:translateX(calc(100% + 2 * var(--editor-gap)));transition:transform var(--slide);pointer-events:none;z-index:3}
.editor[open]{display:block}
.editor.is-visible{transform:none;pointer-events:auto}
.editor-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:9px;border-bottom:1px solid var(--line)}
.editor-head h2{font-size:22px;font-weight:650;line-height:1.15;margin:0}
.icon-button{display:grid;place-items:center;padding:6px;border-color:transparent}
.editor-section{padding:12px 0;border-bottom:1px solid var(--line)}
.editor-section:last-child{padding-bottom:0;border-bottom:0}
.editor h3{display:flex;gap:10px;align-items:center;margin:0 0 9px;font-weight:650;font-size:15px;line-height:1.25}
.editor h3 span{color:var(--accent-ink);padding-right:10px;border-right:1px solid var(--line);font:500 14px/1 Georgia,serif;font-variant-numeric:tabular-nums}
.garments,.zones{display:grid;gap:6px}
.garments{grid-template-columns:repeat(4,minmax(0,1fr))}
.garments button,.zones button,.samples button{border:1px solid var(--line);border-radius:5px;padding:6px;font-size:12px}
.garments button{position:relative;display:grid;place-items:center;gap:3px;padding-block:5px}
.garments button[aria-pressed=true]{border-color:var(--accent);color:var(--ink);background:var(--hover)}
.garments button[aria-pressed=true]::after{content:"";position:absolute;right:6px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.garments svg{height:42px;width:38px}
.zones{grid-template-columns:repeat(4,1fr)}
.color-row,.colors{display:flex;align-items:center;gap:11px}
.color-row{margin-top:11px;font-size:12px}
.colors{gap:10px}
.colors button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--swatch)}
.colors button[aria-pressed=true]{outline:1px solid var(--accent);outline-offset:3px}
.tabs{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.tabs button{position:relative;flex:1;min-height:30px;border:0;border-right:1px solid var(--line);font-size:12px}
.tabs button:last-child{border:0}
.tabs button[aria-pressed=true]{color:var(--accent-ink);box-shadow:inset 0 -2px var(--accent);font-weight:700}
.source{margin-top:9px}
.samples{display:flex;gap:6px}
.samples button{flex:1;min-width:0;padding:5px 4px}
.upload{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;min-height:57px;border:1px dashed #a29583;border-radius:5px;font-size:13px;cursor:pointer}
.upload small,.layer small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.upload input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.upload.active{background:var(--hover);border-color:var(--accent)}
.help{margin:6px 0;font-size:12px;line-height:1.45;color:var(--muted)}
textarea{width:100%;display:block;resize:vertical;min-height:48px;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:7px 8px;font-size:13px;color:var(--ink)}
.generate-actions{display:flex;justify-content:flex-end;margin-top:6px}
.accent{border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:12px;color:inherit}
.generate-actions .accent{color:var(--accent-text);border-color:var(--accent);font-weight:600}
.layer{margin-top:9px;display:flex;align-items:center;gap:9px;border-block:1px solid var(--line);padding:6px 0}
.art-thumb{width:44px;height:44px;display:grid;place-items:center;background:var(--hover);border-radius:4px;flex:none}
.art-thumb img,.art-thumb canvas{width:100%;height:100%;object-fit:contain;padding:3px}
.layer-copy{flex:1;min-width:0}
.layer strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.sliders{display:grid;gap:4px;padding-top:6px}
.sliders .help{margin:0 0 3px}
.sliders label{display:grid;grid-template-columns:35px minmax(0,1fr) 48px;align-items:center;gap:7px;font-size:12px}
.sliders input{width:100%;accent-color:var(--accent);margin:0}
.sliders output{font-size:11px;text-align:center;border:1px solid var(--line);border-radius:4px;padding:2px 0;font-variant-numeric:tabular-nums}
.editor-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.editor-foot a{font-size:12px;color:var(--ink);text-underline-offset:3px}
.editor-foot button{min-height:38px;justify-content:center;padding:7px 16px;border-color:var(--accent);background:var(--accent);color:var(--accent-text);font-weight:650}
.editor-foot button:disabled{opacity:.6;cursor:default}
.notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gray);color:var(--white);padding:9px 15px;border-radius:5px;font-size:13px;z-index:5;max-width:90vw}
.notice:empty{display:none}
.scene-error{position:absolute;inset:40% 10% auto;text-align:center}
.scene-error button{margin-inline:auto}
.scene-loading{position:absolute;top:66px;left:calc((100% - var(--view-right))/2);transform:translateX(-50%);z-index:2;margin:0;padding:6px 10px;border-radius:5px;background:var(--panel);color:var(--ink);font-size:12px;white-space:nowrap;pointer-events:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
/* Keep the garment sharp against a soft pool of studio light and a distant floor shadow. */
.stage{background:radial-gradient(ellipse at 50% 38%,var(--stage-focus),var(--stage-top) 40%,var(--stage-edge) 100%);isolation:isolate}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 76%,var(--stage-floor),transparent 48%);filter:blur(32px);z-index:-1}
.stage:has(+ .editor.is-visible){background-position:-7vw 0;background-size:114% 100%}
.fit-row{margin-top:10px;display:flex;align-items:center;gap:6px;font-size:12px}
.fit-row>span{margin-right:6px;color:var(--muted)}
.fit-row button{padding:5px 13px;border:1px solid var(--line);border-radius:4px}
.fit-row button[aria-pressed=true]{border-color:var(--accent);background:var(--hover)}
.edit-trigger{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}

#viewport{z-index:0}
.stage-top,.stage-bottom,.scene-error{z-index:1}
.stage-top .theme-toggle{display:grid}

.stage-top,.stage-bottom{justify-content:flex-start;gap:10px}
.stage-actions{margin-left:auto;display:flex;gap:8px}
#browse-garments{pointer-events:auto;text-decoration:none;white-space:nowrap;color:inherit}
#browse-garments:hover{border-color:var(--accent)}
#browse-garments:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#fullscreen{justify-content:center;width:37px}
.stage-actions{margin-right:var(--view-right);transition:margin-right var(--slide)}
.touch-tip{display:none}
@media(pointer:coarse){
  .drag-tip{display:none}
  .touch-tip{display:block;font-size:11px;color:var(--muted);position:absolute;bottom:41px;left:0}
}
@media(max-width:930px){
  .studio{--editor-width:345px}
  .studio:has(.editor.is-visible) .drag-tip{display:none}
}
@media(max-width:680px){
  .stage-top,.stage-bottom{left:10px;right:10px}
  .stage-top{top:max(11px,env(safe-area-inset-top))}
  .stage-bottom{bottom:max(12px,env(safe-area-inset-bottom))}
  .quiet{padding:6px 7px}
  #export span,#reset span,#frame-figure span{display:none}
  .stage-top{gap:5px}
  .stage .theme-toggle{min-width:32px;min-height:32px}
  .stage:has(+ .editor.is-visible){background-position:0;background-size:100% 100%}
  .stage-actions{gap:5px}
  #fullscreen{width:33px}
  .stage-bottom .views{position:static;transform:none;margin-left:auto}
  .views button{min-width:33px;padding:7px}
  .editor-active{--view-right:0px;--view-bottom:var(--editor-height,0px)}
  .studio:has(.editor.is-visible) .stage-bottom{display:none}
  .editor{inset:auto 0 0;width:100%;transform:translateY(101%);max-height:55dvh;border:1px solid var(--line);border-radius:12px 12px 0 0;padding:11px 13px max(15px,env(safe-area-inset-bottom))}
  .editor-head{position:sticky;top:-11px;z-index:1;background:var(--panel);margin:-11px -13px 0;padding:11px 13px 9px;border-radius:11px 11px 0 0}
}
@media(max-width:365px){#export span{display:none}.stage-top{gap:6px}}
</style>
</head>
<body>
<main>
  <section class="studio" aria-label="3D 定制工作区">
    <div class="stage" id="stage">
      <div id="viewport" tabindex="0" aria-controls="editor" aria-label="服装预览。方向键环绕，加号和减号缩放，回车打开定制窗。"></div>
      <div class="stage-top">
        <button type="button" class="quiet" id="reset" aria-label="重置视角" title="重置视角"><i data-icon="rotate"></i><span>重置视角</span></button>
        <button type="button" class="quiet" id="frame-figure" aria-label="全身" title="全身"><i data-icon="frame"></i><span>全身</span></button>
        <div class="stage-actions">
          <button type="button" class="theme-toggle" data-theme-toggle aria-label="切换明暗模式" title="切换明暗模式"><svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 15A8.9 8.9 0 0 1 9 3.3 9 9 0 1 0 20.7 15Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
          <a class="quiet" id="browse-garments" href="./garments.html">款式一览 <span aria-hidden="true">↗</span></a>
          <button type="button" class="quiet" id="export" aria-label="保存预览" title="保存预览"><i data-icon="download"></i><span>保存预览</span></button>
          <button type="button" class="quiet" id="fullscreen" aria-label="进入全屏" title="进入全屏"><i data-icon="frame"></i></button>
        </div>
      </div>
      <div class="stage-bottom">
        <span class="edit-trigger"><i data-icon="edit"></i>点击衣服开始定制</span>
        <div class="views" aria-label="预览方向">
          <button type="button" data-angle="0" aria-pressed="true">前</button><button type="button" data-angle="3.14159265359" aria-pressed="false">后</button><button type="button" data-angle="1.57079632679" aria-pressed="false">侧</button>
        </div>
        <span class="drag-tip"><i data-icon="move"></i>左键环绕 · 右键平移 · 滚轮缩放</span><span class="touch-tip">单指环绕 · 双指缩放或平移</span>
      </div>
      <p class="scene-error" id="scene-error" hidden>3D 预览需要支持 WebGL 的浏览器。打开硬件加速后可重试。</p>
      <p class="scene-loading" id="scene-loading" role="status">正在加载服装模型…</p>
      <div class="scene-error" id="scene-retry" hidden><button class="quiet" type="button">重新加载 3D 模型</button></div>
    </div>
    <dialog id="editor" class="editor" aria-labelledby="editor-title">
      <div class="editor-head"><h2 id="editor-title">定制衣服</h2><button type="button" class="icon-button" id="close" aria-label="关闭定制窗"><i data-icon="close"></i></button></div>
      <section class="editor-section">
        <h3><span>01</span>选择服装</h3>
        <div class="garments" id="garments"></div>
        <div class="fit-row" id="fit-options" role="group" aria-label="模特款式"><span>模特</span><button type="button" data-fit="male" aria-pressed="true">男款</button><button type="button" data-fit="female" aria-pressed="false">女款</button></div>
        <div class="color-row"><span>颜色</span><div class="colors" id="colors"></div></div>
      </section>
      <section class="editor-section">
        <h3><span>02</span>选择印花区域</h3>
        <div class="zones" id="zones"></div>
      </section>
      <section class="editor-section">
        <h3><span>03</span>添加图案</h3>
        <div class="tabs" aria-label="图案来源">
          <button type="button" data-source="samples" aria-pressed="true">示例图案</button><button type="button" data-source="upload" aria-pressed="false">上传图片</button><button type="button" data-source="generate" aria-pressed="false">艺术字生成</button>
        </div>
        <div class="source" id="samples"><div class="samples" id="sample-list"></div></div>
        <div class="source" id="upload" hidden><label class="upload"><i data-icon="upload"></i><span>选择或拖入图片<small>PNG、JPG、WEBP · 最大 15 MB</small></span><input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label></div>
        <form class="source" id="generate" hidden>
          <p class="help" id="lettering-hint">在浏览器生成透明底艺术字，支持直接输入文字或用一句话描述。此功能为本地模拟。</p>
          <label for="prompt" class="sr-only">输入艺术字文字或描述</label>
          <textarea id="prompt" aria-describedby="lettering-hint" placeholder="例如：lwj 三个字母拼成艺术字" maxlength="120" rows="2" required></textarea>
          <div class="generate-actions"><button class="accent" type="submit"><i data-icon="spark"></i>生成并印上衣服</button></div>
        </form>
        <div id="layer" class="layer" hidden><div class="art-thumb" id="art-thumb"></div><div class="layer-copy"><strong id="art-name"></strong><small id="art-meta"></small></div><button type="button" id="delete" class="icon-button" aria-label="移除当前区域图案"><i data-icon="trash"></i></button></div>
        <p id="empty-layer" class="help">当前区域还没有图案。</p>
        <div id="sliders" class="sliders" hidden>
          <p class="help">在 3D 预览上按住图案拖动，或用下方滑杆微调。</p>
          <label>缩放<input data-edit="scale" type="range" min="25" max="200" value="100"><output>100%</output></label>
          <label>横向<input data-edit="x" type="range" min="-50" max="50" value="0"><output>0%</output></label>
          <label>纵向<input data-edit="y" type="range" min="-50" max="50" value="0"><output>0%</output></label>
        </div>
      </section>
      <footer class="editor-foot">
        <a href="./garments.html#saved">查看已保存设计</a>
        <button type="button" class="accent" id="save-design" disabled>保存设计</button>
      </footer>
    </dialog>
  </section>
</main>
