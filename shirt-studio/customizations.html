<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="并排查看此浏览器保存的定制服装。">
<title>我的定制 · 3D 试衣</title>
<script>const themeStorageKey='print-lab-theme';
const systemTheme=matchMedia('(prefers-color-scheme: dark)');
let savedTheme;
try {
  const value=localStorage.getItem(themeStorageKey);
  if(value==='light'||value==='dark') savedTheme=value;
} catch {}

function applyTheme(theme){
  document.documentElement.dataset.theme=theme;
  document.querySelectorAll('[data-theme-toggle]').forEach(button=>{
    button.setAttribute('aria-pressed',String(theme==='dark'));
  });
}
applyTheme(savedTheme??(systemTheme.matches?'dark':'light'));
document.addEventListener('DOMContentLoaded',()=>applyTheme(document.documentElement.dataset.theme),{once:true});
systemTheme.addEventListener('change',event=>{
  if(!savedTheme) applyTheme(event.matches?'dark':'light');
});
document.addEventListener('click',event=>{
  if(!event.target.closest('[data-theme-toggle]')) return;
  savedTheme=document.documentElement.dataset.theme==='dark'?'light':'dark';
  applyTheme(savedTheme);
  try { localStorage.setItem(themeStorageKey,savedTheme); } catch {}
});
</script>
<style>:root{
  color-scheme:light;
  --white:#f1f1f1;
  --black:#010101;
  --red:#ff1111;
  --gray:#202020;
  --paper:var(--white);
  --ink:var(--black);
  --accent:var(--red);
  --accent-text:var(--black);
  --accent-ink:#c60000;
  --muted:color-mix(in srgb,var(--ink) 63%,var(--paper));
  --line:color-mix(in srgb,var(--ink) 23%,var(--paper));
  --panel:var(--white);
  --hover:color-mix(in srgb,var(--paper) 94%,var(--ink));
  --stage-focus:#f1f1f1;
  --stage-edge:#c6c6c6;
  --stage-top:#ebebeb;
  --stage-floor:#77777724;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --paper:var(--black);
  --ink:var(--white);
  --muted:color-mix(in srgb,var(--ink) 65%,var(--gray));
  --line:color-mix(in srgb,var(--ink) 20%,var(--gray));
  --panel:var(--gray);
  --hover:color-mix(in srgb,var(--gray) 85%,var(--ink));
  --stage-focus:#333333;
  --stage-edge:#010101;
  --stage-top:#202020;
  --stage-floor:#00000078;
  --accent-ink:#ff6464;
}
.theme-toggle{display:grid;place-items:center;flex:none;min-width:36px;min-height:34px;padding:6px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:5px}
.theme-toggle svg{width:17px;height:17px;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.theme-toggle:hover{background:var(--hover)}
:root[data-theme=dark] .theme-moon,:root:not([data-theme=dark]) .theme-sun{display:none}
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--panel);--line:#dad9d6}
*{box-sizing:border-box}
body{margin:0}
button,a{-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.site-nav{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,3.6vw,56px);font-size:13px}
.back{display:inline-flex;align-items:center;gap:10px;padding:10px 0}
.back:hover{text-decoration:underline;text-underline-offset:5px}
.back span{font-size:19px}
.saved{padding:clamp(25px,5vw,55px) 0}
.saved h1,.saved-status{margin-inline:clamp(18px,3.6vw,56px)}
.saved h1{font-size:clamp(30px,3.6vw,52px);font-weight:530;letter-spacing:-.04em;margin-block:0}
.saved-status{font-size:12px;color:var(--muted);margin-block:9px 21px}
.saved-grid{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(225px,21vw,316px);gap:clamp(12px,1.7vw,24px);padding:4px clamp(18px,3.6vw,56px) 18px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:clamp(18px,3.6vw,56px);scrollbar-width:thin}
.saved-grid>[role=listitem]{min-width:0;scroll-snap-align:start}
.design-card{display:flex;flex-direction:column;height:100%;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.design-card:hover{border-color:var(--accent)}
.design-card img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain;background:radial-gradient(var(--stage-focus),var(--paper))}
.design-card div{display:grid;gap:5px;padding:12px 13px;border-top:1px solid var(--line)}
.design-card strong{font-size:14px}
.design-card time{font-size:11px;color:var(--muted)}
.design-quantities{margin:0;color:var(--ink);font-size:12px;line-height:1.5;font-variant-numeric:tabular-nums}
.design-quantities span{white-space:nowrap}
@media(max-width:740px){
 .site-nav{height:54px}
 .saved-grid{grid-auto-columns:clamp(148px,43vw,238px)}
 .design-card div{padding:9px 10px}
}
</style>
</head>
<body>
<header class="site-nav">
  <a class="back" data-studio href="./"><span aria-hidden="true">←</span> 返回试衣</a>
  <button type="button" class="theme-toggle" data-theme-toggle aria-label="切换明暗模式" title="切换明暗模式"><svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 15A8.9 8.9 0 0 1 9 3.3 9 9 0 1 0 20.7 15Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
</header>
<main>
<section class="saved" id="saved" aria-labelledby="saved-title">
  <h1 id="saved-title">我的定制</h1>
  <p id="saved-status" class="saved-status" role="status">正在读取定制…</p>
  <div class="saved-grid" id="saved-grid" role="list" aria-label="已保存的定制服装"></div>
</section>
</main>
