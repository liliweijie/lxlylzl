<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <title>3D 长图档案 · lXlYlZl</title>
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/space-system.css">
  <link rel="stylesheet" href="css/emblem-system.css">
  <link rel="stylesheet" href="css/responsive-system.css">
  <link rel="stylesheet" href="css/wireframe-system.css">
  <link rel="stylesheet" href="css/rail-gate.css">
  <link rel="stylesheet" href="css/longform-3d-demo.css">
</head>
<body data-page="1">
  <header class="space-header"><a class="space-logo" href="index.html" aria-label="lxlylzl 首页"><img src="assets/space-mark.svg" alt=""><span><b>lXlYlZl</b><small>SPACE FOR IDEAS</small></span></a><nav class="space-links" aria-label="主要导航"><a href="index.html">HOME</a><a href="works.html" aria-current="page">WORK</a><a href="about.html">ABOUT</a><a href="notes.html">NOTES</a><a href="contact.html">CONTACT</a></nav><div class="space-meta"><span>02 / 05</span></div></header>

  <main class="archive" aria-label="长图 3D 档案演示">
    <section class="archive-intro">
      <div class="archive-count"><span id="activeNo">01</span> / <span id="totalNo">10</span></div>
      <h1>LONGFORM<br>ARCHIVE</h1>
      <p>在档案墙中选择一份长图<br>进入磨砂玻璃阅读视图</p>
    </section>

    <section class="deck-zone" aria-label="长图档案墙">
      <div class="perspective-grid" aria-hidden="true"></div>
      <div class="deck" id="deck"></div>
      <div class="deck-index" id="deckIndex" aria-label="档案索引"></div>
      <p class="deck-hint">区域内滚轮 / 右键拖动 · 点击阅读 · 区域外上下滚动</p>
    </section>

    <aside class="reader" id="reader" aria-hidden="true">
      <button class="reader-close" id="readerClose" type="button" aria-label="关闭阅读视图">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
      <div class="reader-meta">
        <span id="readerNo">01 / 10</span>
        <strong id="readerTitle">TEA SEASON</strong>
        <span id="readerType">SOCIAL LONGFORM · 2025</span>
      </div>
      <div class="phone-shell">
        <div class="phone-top" aria-hidden="true"><i></i><span></span></div>
        <div class="phone-viewport" id="phoneViewport" tabindex="0" aria-label="长图滚动阅读区">
          <div class="phone-document" id="phoneDocument"></div>
        </div>
        <div class="phone-home" aria-hidden="true"></div>
      </div>
      <div class="read-progress" aria-hidden="true">
        <span>SCROLL</span>
        <i><b id="progressBar"></b></i>
        <em id="progressText">00%</em>
      </div>
      <div class="reader-nav">
        <button type="button" id="prevWork" aria-label="上一份长图">
          <svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg><span>PREV</span>
        </button>
        <button type="button" id="nextWork" aria-label="下一份长图">
          <span>NEXT</span><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg>
        </button>
      </div>
    </aside>
  </main>

  <footer class="demo-footer">
    <span>3D LONGFORM VIEWER / PROTOTYPE 01</span>
    <span>CLICK A FRAME TO READ</span>
  </footer>
  <script src="js/longform-data.js"></script>
  <script>if(window.parent===window){var s=document.createElement('script');s.src='js/editorial-navigation.js';document.body.appendChild(s)}else{document.documentElement.classList.add('embedded')}</script>
  <script src="js/longform-3d-demo.js"></script>
</body>
</html>
