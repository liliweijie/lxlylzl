<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3-Column Infinite Loop — Demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #121111;
    --text: #fff;
    --text-muted: #8a8a9a;
    --accent: #c0392b;
    --card-width: 52rem;
    --img-height: 74rem;
    --card-gap: 14rem;
    --col-gap: 6rem;
  }

  html {
    font-size: .5787037037vw;
  }

  @media (max-width: 900px) {
    html { font-size: 2.6666666667vw; }
  }

  @media (max-width: 600px) {
    html { font-size: 2.6666666667vw; }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    cursor: default;
  }

  /* ===== GRID — full viewport, 3 columns centered ===== */
  .work-grid {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    gap: var(--col-gap);
    padding: 0 2rem;
  }

  /* ===== COLUMN ===== */
  .work-col {
    position: relative;
    width: var(--card-width);
    flex-shrink: 0;
    will-change: transform;
  }

  /* ===== CARD ===== */
  .work-card {
    width: var(--card-width);
    position: relative;
    margin-bottom: var(--card-gap);
  }

  .work-card:first-child {
    margin-top: 0;
  }

  /* ===== IMAGE WRAP ===== */
  .work-card__imageWrap {
    position: relative;
    width: 100%;
    height: var(--img-height);
    overflow: hidden;
    border-radius: 1rem;
    transition: transform 0.3s cubic-bezier(.155,.055,.14,1);
  }

  .work-card:hover .work-card__imageWrap {
    transform: scale(1.02);
  }

  .work-card__img {
    position: absolute;
    left: 0; top: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 1rem;
  }

  /* ===== CONTENT ===== */
  .work-card__content {
    margin-top: 1.8rem;
    padding: 0 2rem;
  }

  /* ===== CLIENT PILL ===== */
  .work-card__client {
    display: inline-block;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: #fff;
    color: #000;
    padding: 0.5rem 1rem;
    border-radius: 100px;
    margin-bottom: -1rem;
    margin-top: -1.3rem;
  }

  /* ===== TITLE ===== */
  .work-card__title {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-weight: 400;
    font-size: 2.5rem;
    line-height: 1.45;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  /* ===== TAGS ===== */
  .work-card__tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .work-card__tag {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 1rem;
    line-height: 1.65;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* ===== SCROLL PROGRESS ===== */
  .scroll-progress {
    position: fixed;
    top: 3rem;
    right: 3rem;
    z-index: 100;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 1rem;
    letter-spacing: 0.15em;
    color: var(--text-muted);
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    :root {
      --card-width: 32rem;
      --img-height: 45rem;
      --card-gap: 8rem;
      --col-gap: 2rem;
    }
    .work-card__title { font-size: 1.5rem; }
    .work-card__tag { font-size: 0.7rem; }
    .work-card__client { font-size: 0.6rem; padding: 0.35rem 0.7rem; }
  }

  @media (max-width: 600px) {
    :root {
      --card-width: 28rem;
      --img-height: 40rem;
      --card-gap: 6rem;
      --col-gap: 1.5rem;
    }
    .work-card__title { font-size: 1.2rem; }
    .work-card__tags { display: none; }
  }
</style>
</head>
<body>

<!-- ===== GRID ===== -->
<!-- ===== SCROLL PROGRESS ===== -->
<div class="scroll-progress" id="scrollProgress">00</div>

<!-- ===== GRID ===== -->
<div class="work-grid" id="workGrid">
  <div class="work-col" id="col0"></div>
  <div class="work-col" id="col1"></div>
  <div class="work-col" id="col2"></div>
</div>

<script>
(function() {
  // ===== PROJECT DATA =====
  const projects = [
    { title: 'Central on Air', client: 'Central on Air', desc: 'Amplifying the Local Music Scene', tags: ['Design', 'Dev', 'Branding'], color: '#2d1b69' },
    { title: 'Patch System', client: 'Patch System', desc: 'Clinic marketing made easy', tags: ['Design', 'Dev'], color: '#1a3a2a' },
    { title: 'Unis Footwear', client: 'Unis Footwear', desc: 'Turning trash into treasure 3D printing Sneakers', tags: ['Design', 'Dev'], color: '#3d2b1a' },
    { title: 'HŌM', client: 'HŌM', desc: 'Connecting people to the planet through food', tags: ['Design', 'Dev', 'Branding', 'Packaging'], color: '#1a2e1a' },
    { title: 'ZaZa', client: 'ZaZa', desc: 'Culturally empowered Streetwear out of Sydney', tags: ['Design', 'Branding'], color: '#3a1a2a' },
    { title: 'Radical Face', client: 'Radical Face', desc: 'A modern take on a fairytale', tags: ['Design', 'Dev'], color: '#0d1f2d' },
    { title: 'Overmind AI', client: 'Overmind', desc: 'Getting you from question to conclusion faster', tags: ['Design', 'Branding'], color: '#0a1628' },
    { title: 'Lens', client: 'Lens', desc: 'Digital editorial covering the business of creativity', tags: ['Design', 'Branding'], color: '#1a1a2a' },
    { title: 'Brews & Grooves', client: 'Brews & Grooves', desc: 'Human-kinds greatest combo', tags: ['Design', 'Branding'], color: '#2d1a0d' },
    { title: 'Animus', client: 'Animus', desc: 'A small & mighty video agency', tags: ['Design', 'Dev', 'Branding'], color: '#1a2d1a' },
    { title: 'RhythmInfluence', client: 'RhythmInfluence', desc: 'Empowering the voices that define modern culture', tags: ['Design', 'Dev', 'Branding'], color: '#2a1a3d' },
    { title: 'Canvas Agency', client: 'Canvas Agency', desc: 'A coven of passionate, imaginative humans', tags: ['Design', 'Dev'], color: '#0d2d2d' },
    { title: 'Lightswitch Video', client: 'Lightswitch Video', desc: 'From pre-roll to broadcast, you are covered', tags: ['Design', 'Dev', 'Branding'], color: '#2d2d0d' },
    { title: 'Blank Round', client: 'Blank Round', desc: 'Culturally empowered Streetwear', tags: ['Design', 'Branding'], color: '#1d1d2d' },
  ];

  // ===== GENERATE CARD =====
  function generateCard(p, idx) {
    const tagHtml = p.tags.map(t => `<span class="work-card__tag">+ ${t}</span>`).join('');
    return `
      <div class="work-card" data-index="${idx}">
        <div class="work-card__imageWrap">
          <svg class="work-card__img" viewBox="0 0 520 740" preserveAspectRatio="xMidYMid slice"
               style="background:${p.color}">
            <defs>
              <linearGradient id="g${idx}" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:rgba(255,255,255,0.10)"/>
                <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
              </linearGradient>
            </defs>
            <rect width="520" height="740" fill="url(#g${idx})"/>
            <text x="50%" y="44%" text-anchor="middle" fill="rgba(255,255,255,0.08)"
                  font-family="Inter,sans-serif" font-weight="900"
                  font-size="48px" letter-spacing="0.15em">${String(idx + 1).padStart(2,'0')}</text>
            <text x="50%" y="58%" text-anchor="middle" fill="rgba(255,255,255,0.05)"
                  font-family="Inter,sans-serif" font-weight="400"
                  font-size="18px" letter-spacing="0.3em">PROJECT</text>
          </svg>
        </div>
        <div class="work-card__content">
          <div class="work-card__client">${p.client}</div>
          <div class="work-card__title">${p.title}</div>
          <div class="work-card__tags">${tagHtml}</div>
        </div>
      </div>`;
  }

  // ===== BUILD COLUMNS =====
  const cols = [document.getElementById('col0'), document.getElementById('col1'), document.getElementById('col2')];
  const distributions = [[], [], []];
  projects.forEach((p, i) => { distributions[i % 3].push(p); });

  cols.forEach((col, ci) => {
    let html = '';
    distributions[ci].forEach((p, i) => { html += generateCard(p, ci * 10 + i); });
    html += html + html; // 3× for seamless loop
    col.innerHTML = html;
  });

  // ===== SCROLL STATE =====
  const speeds = [2.0, 2.5, 1.5];
  const COLUMN_HEIGHT = 200; // vh (200% of viewport for 3× loop)
  const SCROLL_RANGE = 100;

  let totalScroll = Math.random() * 5000;
  let displayScroll = totalScroll;

  // ===== WHEEL =====
  window.addEventListener('wheel', function(e) {
    e.preventDefault();
    totalScroll += e.deltaY * 0.15;
  }, { passive: false });

  // ===== TOUCH =====
  let touchStartY = 0, touchScrollBase = 0;
  window.addEventListener('touchstart', function(e) {
    touchStartY = e.touches[0].clientY;
    touchScrollBase = totalScroll;
  }, { passive: true });
  window.addEventListener('touchmove', function(e) {
    totalScroll = touchScrollBase + (touchStartY - e.touches[0].clientY) * 0.3;
  }, { passive: true });

  // ===== RENDER =====
  const progressEl = document.getElementById('scrollProgress');
  (function update() {
    displayScroll += (totalScroll - displayScroll) * 0.08;
    const visualScroll = ((displayScroll % SCROLL_RANGE) + SCROLL_RANGE) % SCROLL_RANGE;

    cols.forEach((col, ci) => {
      const offset = ((visualScroll * speeds[ci]) % COLUMN_HEIGHT + COLUMN_HEIGHT) % COLUMN_HEIGHT;
      col.style.transform = `translateY(${-offset}vh)`;
    });

    const pct = Math.round((visualScroll / SCROLL_RANGE) * 100);
    progressEl.textContent = String(pct).padStart(2, '0');

    requestAnimationFrame(update);
  })();
})();
</script>
</body>
</html>
