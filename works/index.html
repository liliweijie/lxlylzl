<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Works — lxlylzl</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #0a0a0a;
  color: #fff;
  overflow: hidden;
}

/* 顶部导航 */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 32px;
  background: linear-gradient(to bottom, rgba(10,10,10,0.9) 0%, transparent 100%);
  pointer-events: none;
}
.nav a {
  color: rgba(255,255,255,0.7);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  pointer-events: auto;
  transition: color 0.2s;
}
.nav a:hover { color: #fff; }
.nav .logo {
  font-size: 18px;
  font-weight: 600;
  color: #fff;
  letter-spacing: 2px;
}

/* 作品容器 */
.works-container {
  height: 100vh;
  overflow: hidden;
  position: relative;
  cursor: grab;
  user-select: none;
}
.works-container:active { cursor: grabbing; }

.col {
  position: absolute;
  top: 0;
  width: 30%;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 80px 0 40px;
  will-change: transform;
}
.col-left { left: 2.5%; }
.col-mid { left: 35%; }
.col-right { left: 67.5%; }

.work-card {
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.06);
  background: #111;
  flex-shrink: 0;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.work-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 16px 40px rgba(0,0,0,0.5);
}

.work-media {
  width: 100%;
  aspect-ratio: 4/5;
  position: relative;
  overflow: hidden;
  background: #1a1a1a;
}
.work-media video,
.work-media .fallback {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.work-media .fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.7);
  font-weight: 600;
  font-size: 16px;
  letter-spacing: 1px;
  text-align: center;
  padding: 16px;
}

.work-info { padding: 14px; }
.work-title {
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 4px;
  color: #fff;
}
.work-desc {
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  margin-bottom: 10px;
  line-height: 1.4;
}
.work-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.work-tag {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 4px;
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.5);
}

/* 冷暖色调背景 —— 按 ROGUE 剪辑逻辑排列 */
.tone-cold-blue { background: linear-gradient(135deg, #1a237e, #3949ab); }
.tone-sat-blue { background: linear-gradient(135deg, #2962ff, #448aff); }
.tone-red-neon { background: linear-gradient(135deg, #b71c1c, #f44336); }
.tone-warm-orange { background: linear-gradient(135deg, #e65100, #ff9800); }
.tone-mixed { background: linear-gradient(135deg, #f9a825, #cddc39, #9c27b0); }
.tone-warm-brown { background: linear-gradient(135deg, #5d4037, #8d6e63); }
.tone-dark-teal { background: linear-gradient(135deg, #004d40, #00695c); }
.tone-soft-purple { background: linear-gradient(135deg, #4a148c, #7b1fa2); }
.tone-bright-orange { background: linear-gradient(135deg, #e65100, #ff6f00); }
.tone-dark-room { background: linear-gradient(135deg, #212121, #424242); }
.tone-sky { background: linear-gradient(180deg, #01579b, #0288d1, #4fc3f7); }
.tone-grass { background: linear-gradient(135deg, #1b5e20, #33691e, #558b2f); }

/* 底部提示 */
.hint {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: rgba(255,255,255,0.25);
  z-index: 100;
  pointer-events: none;
}
</style>
</head>
<body>

<!-- 导航 -->
<div class="nav">
  <a href="/" class="logo">LXLYLZL</a>
  <div style="display:flex;gap:24px;">
    <a href="/">首页</a>
    <a href="/work">作品</a>
    <a href="/about">关于</a>
  </div>
</div>

<!-- 作品墙 -->
<div class="works-container" id="wrap">
  <div class="col col-left" id="col1"></div>
  <div class="col col-mid" id="col2"></div>
  <div class="col col-right" id="col3"></div>
</div>

<div class="hint">滚动或拖拽浏览 · 无限循环</div>

<script>
const wrap = document.getElementById('wrap');
const cols = [document.getElementById('col1'), document.getElementById('col2'), document.getElementById('col3')];

// ========== 作品数据（带视频占位） ==========
// 视频使用公开测试素材，可替换为你自己的作品视频
const works = [
  {
    title: '梦境枷锁',
    desc: '悬疑科幻剧本 · 现实与梦境的边界',
    tags: ['剧本', '悬疑', '科幻'],
    tone: 'tone-dark-teal',
    video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
    poster: null
  },
  {
    title: '像素冒险',
    desc: '像素风 RPG 游戏 · 复古美学',
    tags: ['游戏', '像素风', '设计'],
    tone: 'tone-sat-blue',
    video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
    poster: null
  },
  {
    title: '个人网站',
    desc: '前端设计与开发 · 品牌数字体验',
    tags: ['前端', 'React', '设计'],
    tone: 'tone-cold-blue',
    video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',
    poster: null
  },
  {
    title: '社保计算器',
    desc: '实用工具 · 深圳灵活就业缴费测算',
    tags: ['工具', '实用', '深圳'],
    tone: 'tone-warm-orange',
    video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4',
    poster: null
  },
  {
    title: '语音助手',
    desc: 'AI 语音交互 · 自然对话体验',
    tags: ['AI', '语音', '交互'],
    tone: 'tone-soft-purple',
    video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4',
    poster: null
  },
  {
    title: '礼盒设计',
    desc: '游戏周边视觉 · 包装与品牌',
    tags: ['视觉', '包装', '游戏'],
    tone: 'tone-red-neon',
    video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4',
    poster: null
  },
  {
    title: '播客生成',
    desc: 'AI 音频内容 · 自动化播客制作',
    tags: ['音频', 'AI', '内容'],
    tone: 'tone-warm-brown',
    video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4',
    poster: null
  },
  {
    title: '转场动画',
    desc: '页面切换动效 · CSS 流畅过渡',
    tags: ['动画', 'CSS', '流畅'],
    tone: 'tone-mixed',
    video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4',
    poster: null
  },
  {
    title: '数据看板',
    desc: '数据可视化 · 图表与仪表盘',
    tags: ['数据', '可视化', '图表'],
    tone: 'tone-bright-orange',
    video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackOnStreetAndDirt.mp4',
    poster: null
  },
  {
    title: '笔记系统',
    desc: '知识管理 · 效率工具设计',
    tags: ['效率', '知识', '管理'],
    tone: 'tone-grass',
    video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/VolkswagenGTIReview.mp4',
    poster: null
  },
  {
    title: ' rhythm Influence',
    desc: '文化赋能 · 现代街头品牌',
    tags: ['设计', '品牌', '文化'],
    tone: 'tone-dark-room',
    video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WeAreGoingOnBullrun.mp4',
    poster: null
  },
  {
    title: 'Lens 数字出版',
    desc: '创意商业 · 数字编辑设计',
    tags: ['设计', '品牌', '出版'],
    tone: 'tone-sky',
    video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WhatCarCanYouGetForAGrand.mp4',
    poster: null
  }
];

function makeCard(work) {
  const card = document.createElement('div');
  card.className = 'work-card';

  const tagsHtml = work.tags.map(t => `<span class="work-tag">+ ${t}</span>`).join('');

  card.innerHTML = `
    <div class="work-media">
      <video class="work-video" muted loop playsinline autoplay
        poster=""
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <source src="${work.video}" type="video/mp4">
      </video>
      <div class="fallback ${work.tone}" style="display:none">${work.title}</div>
    </div>
    <div class="work-info">
      <div class="work-title">${work.title}</div>
      <div class="work-desc">${work.desc}</div>
      <div class="work-tags">${tagsHtml}</div>
    </div>
  `;

  // 视频加载失败时显示 fallback
  const video = card.querySelector('video');
  video.addEventListener('error', () => {
    video.style.display = 'none';
    card.querySelector('.fallback').style.display = 'flex';
  });

  return card;
}

// 三列配置：速度 + 作品索引（手动打散，避免同类相邻）
const configs = [
  { track: cols[0], speed: 0.6, indices: [0, 3, 6, 9, 11] },   // 慢速：5个
  { track: cols[1], speed: 1.0, indices: [1, 4, 7, 10, 2, 5, 8, 0] }, // 常速：8个
  { track: cols[2], speed: 1.4, indices: [2, 5, 8, 11, 1, 4, 7, 10, 0, 3, 6] } // 快速：11个
];

// 填充两份内容实现无缝循环
configs.forEach(cfg => {
  for (let dup = 0; dup < 2; dup++) {
    cfg.indices.forEach(idx => {
      cfg.track.appendChild(makeCard(works[idx % works.length]));
    });
  }
});

let scrollY = 0;
let isDown = false, startY = 0, lastScroll = 0;
const loopH = [0, 0, 0];

requestAnimationFrame(() => {
  configs.forEach((cfg, i) => {
    loopH[i] = cfg.track.scrollHeight / 2;
  });
});

function update() {
  configs.forEach((cfg, i) => {
    const h = loopH[i] || cfg.track.scrollHeight / 2;
    const y = -(scrollY * cfg.speed % h);
    cfg.track.style.transform = `translateY(${y}px)`;
  });
}

// 滚轮
wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  scrollY += e.deltaY;
  update();
}, { passive: false });

// 拖拽
wrap.addEventListener('mousedown', (e) => {
  isDown = true;
  startY = e.clientY;
  lastScroll = scrollY;
  wrap.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', (e) => {
  if (!isDown) return;
  scrollY = lastScroll + (startY - e.clientY);
  update();
});
window.addEventListener('mouseup', () => {
  isDown = false;
  wrap.style.cursor = 'grab';
});

// 触摸支持
wrap.addEventListener('touchstart', (e) => {
  isDown = true;
  startY = e.touches[0].clientY;
  lastScroll = scrollY;
}, { passive: true });
window.addEventListener('touchmove', (e) => {
  if (!isDown) return;
  scrollY = lastScroll + (startY - e.touches[0].clientY);
  update();
}, { passive: true });
window.addEventListener('touchend', () => {
  isDown = false;
});

// 自动缓慢滚动
function auto() {
  if (!isDown) { scrollY += 0.3; update(); }
  requestAnimationFrame(auto);
}
auto();
</script>

</body>
</html>
