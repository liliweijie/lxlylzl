<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡片入场动画 Demo（3 张真卡）</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0E0E0E;
    --text: #F9F9F9;
    --text-muted: #DBDBDB;
    --panel: #262626;
    --accent: #F24C30;
    --pill-bg: rgba(255,255,255,0.08);
    --pill-border: rgba(255,255,255,0.14);
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system,'PingFang SC','Noto Sans SC',sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    overflow: hidden;
  }

  /* ===== 控制条 ===== */
  .ctrl {
    position: fixed;
    top: 24px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 100;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 92vw;
  }
  .ctrl button, .ctrl select {
    height: 40px;
    padding: 0 18px;
    border-radius: 100px;
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    color: var(--text);
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
    transition: background .25s, border-color .25s;
  }
  .ctrl button:hover, .ctrl select:hover { background: var(--panel); border-color: var(--accent); }
  .ctrl label { font-size: .82rem; color: var(--text-muted); }

  /* ===== 卡片舞台：3 张真卡同高并排 ===== */
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    max-width: 96vw;
    overflow-x: auto;
    padding: 10px 6px;
  }
  .card {
    flex: 0 0 auto;
    height: clamp(300px, 54vh, 540px);   /* 三张等高，宽度按各自比例 */
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    opacity: 0;
    will-change: transform, opacity;
  }
  .card img {
    height: 100%;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 18px 42px rgba(0,0,0,0.40));
  }
  /* 进入态：缓停到位（ease-out 缓停曲线） */
  .card.in {
    opacity: 1;
    transform: translate(0,0) scale(1) !important;
    transition: opacity .65s ease-out, transform .9s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .hint {
    position: fixed; bottom: 22px; left: 50%;
    transform: translateX(-50%);
    font-size: .8rem; color: var(--text-muted);
    letter-spacing: .06em;
    text-align: center;
    max-width: 92vw;
  }
</style>
</head>
<body>

  <div class="ctrl">
    <button id="replay">↻ 重播</button>
    <label>节奏</label>
    <select id="speed">
      <option value="650">舒缓 (650ms)</option>
      <option value="420" selected>标准 (420ms)</option>
      <option value="260">紧凑 (260ms)</option>
    </select>
    <label>方向</label>
    <select id="dir">
      <option value="up" selected>从下浮起</option>
      <option value="right">从右滑入</option>
      <option value="scale">缩放淡入</option>
    </select>
    <label>顺序</label>
    <select id="order">
      <option value="lr" selected>资源3 → 4 → 5（左→右）</option>
      <option value="rl">资源5 → 4 → 3（右→左）</option>
    </select>
  </div>

  <div class="stage" id="stage">
    <div class="card"><img src="home.svg"  title="资源 3（主视觉）" alt="资源3"></div>
    <div class="card"><img src="card-2.svg" title="资源 4" alt="资源4"></div>
    <div class="card"><img src="card-3.svg" title="资源 5" alt="资源5"></div>
  </div>

  <div class="hint">三张真卡（资源 3 / 4 / 5，等高 156.66 并排）一张张进入 → 缓停 → 下一张</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const replay = document.getElementById('replay');
  const speedSel = document.getElementById('speed');
  const dirSel = document.getElementById('dir');
  const orderSel = document.getElementById('order');
  let timers = [];

  function getCards(){
    let cards = Array.prototype.slice.call(stage.querySelectorAll('.card'));
    if (orderSel.value === 'rl') cards = cards.slice().reverse();
    return cards;
  }

  function setInitial(dir){
    stage.querySelectorAll('.card').forEach(function(c){
      c.classList.remove('in');
      if (dir === 'right')      c.style.transform = 'translateX(70px) scale(0.96)';
      else if (dir === 'scale') c.style.transform = 'scale(0.86)';
      else                      c.style.transform = 'translateY(52px) scale(0.94)';
      c.style.opacity = '0';
    });
  }

  function play(){
    timers.forEach(clearTimeout); timers = [];
    const gap = parseInt(speedSel.value, 10);
    const dir = dirSel.value;
    setInitial(dir);
    void stage.offsetWidth;                 // 强制回流，初始态生效
    getCards().forEach(function(c, i){
      const t = setTimeout(function(){
        c.classList.add('in');
      }, i * gap + 150);
      timers.push(t);
    });
  }

  replay.addEventListener('click', play);
  speedSel.addEventListener('change', play);
  dirSel.addEventListener('change', play);
  orderSel.addEventListener('change', play);
  play();
})();
</script>
</body>
</html>
