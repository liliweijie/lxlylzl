<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lxlylzl — 李威杰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ===== 5-COLOR STANDARD PALETTE ===== */
  :root {
    --bg: #0E0E0E;          /* 近黑 */
    --text: #F9F9F9;        /* 近白 */
    --text-muted: #DBDBDB;  /* 浅灰 */
    --panel: #262626;       /* 炭灰 */
    --accent: #F24C30;      /* 橙红 */
    --nav-bg: rgba(255,255,255,0.04);
    --nav-border: rgba(255,255,255,0.12);
    --frame-bg: rgba(255,255,255,0.03);
    --frame-border: rgba(255,255,255,0.08);
  }
  [data-theme="light"] {
    --bg: #F9F9F9;
    --text: #0E0E0E;
    --text-muted: #262626;
    --panel: #DBDBDB;
    --nav-bg: rgba(0,0,0,0.04);
    --nav-border: rgba(0,0,0,0.12);
    --frame-bg: rgba(0,0,0,0.02);
    --frame-border: rgba(0,0,0,0.08);
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    overflow: hidden;
    transition: background 0.45s ease, color 0.45s ease;
  }

  /* ===== GLASS FRAME ===== */
  .glass-frame {
    position: fixed;
    inset: 24px;
    border-radius: 28px;
    background: var(--frame-bg);
    backdrop-filter: blur(24px) saturate(1.2);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    border: 1px solid var(--frame-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.45s ease, border-color 0.45s ease;
  }

  /* ===== TOP NAV (three-segment) ===== */
  .top-nav {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    flex-shrink: 0;
  }
  .nav-left  { display: flex; align-items: center; }
  .nav-right { display: flex; align-items: center; }

  .nav-logo {
    height: 26px;
    width: auto;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .nav-logo:hover { opacity: 0.7; }

  .nav-center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px;
    background: var(--nav-bg);
    backdrop-filter: blur(32px) saturate(1.2);
    -webkit-backdrop-filter: blur(32px) saturate(1.2);
    border: 1px solid var(--nav-border);
    border-radius: 100px;
    transition: background 0.3s, border-color 0.3s;
  }

  /* capsule nav links */
  .nav-link {
    display: inline-flex;
    align-items: baseline;
    gap: 0.35em;
    height: 38px;
    padding: 0 16px;
    border-radius: 100px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.92rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    white-space: nowrap;
    transition: color 0.25s;
  }
  .nav-link__text { display: inline-flex; }
  .nav-link__text .ch {
    display: inline-block;
    font-weight: 400;
    transition: font-weight 0.18s ease;
    transition-delay: calc(var(--i) * 0.03s);
  }
  .nav-link__en {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.55;
    transition: opacity 0.25s;
  }
  .nav-link:hover { color: var(--text); }
  .nav-link:hover .nav-link__text .ch { font-weight: 700; }
  .nav-link:hover .nav-link__en { opacity: 0.9; }
  .nav-link.is-active { color: var(--text); }
  .nav-link.is-active .nav-link__text .ch { font-weight: 700; }
  .nav-link.is-active .nav-link__en { opacity: 0.9; }
  .nav-soon { opacity: 0.45; }
  .nav-soon:hover { opacity: 0.7; }

  /* theme toggle */
  .theme-btn {
    width: 32px; height: 32px;
    border: none; background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center; justify-content: center;
    transition: color 0.3s;
    border-radius: 8px;
  }
  .theme-btn:hover { color: var(--accent); }
  .theme-btn svg {
    width: 18px; height: 18px;
    stroke: currentColor; fill: none;
    stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* ===== HERO ===== */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
    min-height: 0;
  }
  .hero__inner { max-width: 720px; }
  .hero__eyebrow {
    color: var(--accent);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: 0.78rem;
    font-weight: 500;
    margin-bottom: 1.6rem;
  }
  .hero__title {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-weight: 500;
    font-size: clamp(3.2rem, 9vw, 7rem);
    line-height: 1.04;
    letter-spacing: 0.02em;
  }
  .hero__brand {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 1rem;
    font-size: 1rem;
    padding-left: 0.42em;
  }
  .hero__desc {
    color: var(--text-muted);
    margin: 2.2rem auto 0;
    max-width: 520px;
    font-size: 1.05rem;
    line-height: 1.85;
    font-weight: 400;
  }
  .hero__actions {
    margin-top: 2.6rem;
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5em;
    padding: 0.9rem 1.9rem;
    border-radius: 100px;
    font-size: 0.95rem;
    font-weight: 500;
    text-decoration: none;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform 0.25s, filter 0.25s, border-color 0.25s, color 0.25s;
  }
  .btn--primary { background: var(--accent); color: #fff; }
  .btn--primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn--ghost { border-color: var(--nav-border); color: var(--text); background: var(--nav-bg); }
  .btn--ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* ===== FOOTER ===== */
  .hero__foot {
    flex-shrink: 0;
    padding: 16px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-muted);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    border-top: 1px solid var(--frame-border);
  }
  .hero__foot a { color: var(--text-muted); text-decoration: none; transition: color 0.25s; }
  .hero__foot a:hover { color: var(--accent); }
  .hero__foot-links { display: flex; gap: 18px; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    .glass-frame { inset: 12px; border-radius: 18px; }
    .top-nav { padding: 14px 16px; }
    .nav-link { font-size: 0.78rem; padding: 0 11px; height: 34px; }
    .nav-center { padding: 4px; gap: 4px; }
    .hero__desc { font-size: 0.98rem; }
  }
  @media (max-width: 600px) {
    .glass-frame { inset: 8px; border-radius: 14px; }
    .top-nav { padding: 12px 12px; }
    .nav-link { font-size: 0.7rem; padding: 0 9px; height: 30px; }
    .nav-link__en { display: none; }
    .hero { padding: 0 16px; }
    .hero__actions { flex-direction: column; width: 100%; max-width: 280px; }
    .btn { justify-content: center; }
    .hero__foot { flex-direction: column; gap: 8px; text-align: center; }
  }
</style>
</head>
<body>

<!-- ===== GLASS FRAME ===== -->
<div class="glass-frame">

  <!-- ===== TOP NAV ===== -->
  <nav class="top-nav">
    <div class="nav-left">
      <a href="index.html"><img class="nav-logo" id="logoBtn" src="logo.svg" alt="LX Logo"></a>
    </div>

    <div class="nav-center">
      <a class="nav-link is-active" href="index.html"><span class="nav-link__text" data-text="首页">首页</span><span class="nav-link__en">Home</span></a>
      <a class="nav-link" href="works.html"><span class="nav-link__text" data-text="作品">作品</span><span class="nav-link__en">Works</span></a>
      <a class="nav-link nav-soon" href="#" title="即将上线"><span class="nav-link__text" data-text="关于">关于</span><span class="nav-link__en">About</span></a>
      <a class="nav-link nav-soon" href="#" title="即将上线"><span class="nav-link__text" data-text="碎碎念">碎碎念</span><span class="nav-link__en">Notes</span></a>
    </div>

    <div class="nav-right">
      <button class="theme-btn" id="themeBtn" aria-label="切换明暗模式">
        <svg class="icon-sun" viewBox="0 0 24 24" style="display:none;">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- ===== HERO ===== -->
  <main class="hero">
    <div class="hero__inner">
      <p class="hero__eyebrow">平面设计师 · AI 产品创作者</p>
      <h1 class="hero__title">李威杰</h1>
      <p class="hero__brand">lxlylzl</p>
      <p class="hero__desc">
        以视觉设计与 AI 工具塑造有温度的产品体验。<br>
        从品牌、界面到 AI 应用，让创意真正落地。
      </p>
      <div class="hero__actions">
        <a class="btn btn--primary" href="works.html">查看作品 →</a>
        <a class="btn btn--ghost" href="#" onclick="return false;" title="即将上线">关于我</a>
      </div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="hero__foot">
    <span>© 2026 liliweijie · lxlylzl</span>
    <div class="hero__foot-links">
      <a href="works.html">作品</a>
      <a href="#" onclick="return false;" title="即将上线">关于</a>
      <a href="#" onclick="return false;" title="即将上线">碎碎念</a>
    </div>
  </footer>

</div>

<script>
// ===== THEME =====
(function() {
  function getPreferredTheme() {
    const stored = localStorage.getItem('theme');
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const iconSun = document.querySelector('.icon-sun');
    const iconMoon = document.querySelector('.icon-moon');
    if (theme === 'light') {
      iconSun.style.display = '';
      iconMoon.style.display = 'none';
    } else {
      iconSun.style.display = 'none';
      iconMoon.style.display = '';
    }
    const logo = document.getElementById('logoBtn');
    if (logo) logo.src = theme === 'light' ? 'logo-light.svg' : 'logo.svg';
  }
  applyTheme(getPreferredTheme());
  document.getElementById('themeBtn').addEventListener('click', function() {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
  });

  // ===== NAV: per-character bold hover + placeholder handling =====
  document.querySelectorAll('.nav-link__text').forEach(function(el) {
    const txt = el.getAttribute('data-text') || el.textContent;
    el.innerHTML = '';
    [].forEach.call(txt, function(ch, i) {
      const s = document.createElement('span');
      s.className = 'ch';
      s.style.setProperty('--i', i);
      s.textContent = ch;
      el.appendChild(s);
    });
  });
  document.querySelectorAll('.nav-soon').forEach(function(a) {
    a.addEventListener('click', function(e) { e.preventDefault(); });
  });
})();
</script>
</body>
</html>
