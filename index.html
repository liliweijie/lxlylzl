<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>liliweijie - 平面设计师</title>
<style>
  /* ========== RESET & BASE ========== */
  *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }

  :root {
    --accent: #c0392b;
    --accent-glow: rgba(192,57,43,0.25);
    --glass-bg: rgba(18,18,24,0.72);
    --glass-border: rgba(255,255,255,0.08);
    --text-primary: #f0ece4;
    --text-secondary: #9898a8;
    --text-muted: #5a5a6a;
    --bg-primary: #0e0e12;
    --nav-bg: rgba(18,18,24,0.6);
  }

  [data-theme="light"] {
    --glass-bg: rgba(255,255,255,0.72);
    --glass-border: rgba(0,0,0,0.08);
    --text-primary: #1a1a2e;
    --text-secondary: #6a6a7a;
    --text-muted: #a0a0b0;
    --bg-primary: #f5f0e8;
    --nav-bg: rgba(255,255,255,0.6);
  }

  html { font-size: 16px; scroll-behavior: smooth; }

  body {
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow: hidden;
    height: 100vh;
    transition: background 0.45s cubic-bezier(0.4,0,0.2,1), color 0.45s cubic-bezier(0.4,0,0.2,1);
  }

  /* ========== PAGE WRAPPER — below nav, max size ========== */
  .page-wrapper {
    position: fixed;
    top: 52px; left: 72px; right: 72px; bottom: 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }

  /* ========== TOP NAV — fixed at viewport top ========== */
  .top-nav {
    position: fixed;
    top: 2px; left: 72px; right: 72px;
    height: 47px;
    z-index: 1000;
    pointer-events: none;
    display: flex;
    align-items: center;
  }

  .top-nav * { pointer-events: auto; }

  .nav-section {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 18px;
    background: var(--nav-bg);
    backdrop-filter: blur(32px) saturate(1.2);
    -webkit-backdrop-filter: blur(32px) saturate(1.2);
    border: 1px solid var(--glass-border);
    border-radius: 100px;
    transition: background 0.3s, border-color 0.3s;
    box-sizing: border-box;
    height: 42px;
  }

  .top-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-left, .nav-center, .nav-right {
    position: static;
    top: auto; left: auto; right: auto;
    transform: none;
  }

  .nav-center {
    flex: 1;
    min-width: 0;
    display: flex;
    justify-content: center;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .nav-center::-webkit-scrollbar { display: none; }

  .nav-links { flex-wrap: nowrap; }

  .nav-logo {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
    letter-spacing: -0.02em;
    user-select: none;
    transition: opacity 0.2s;
  }
  .nav-logo:hover { opacity: 0.7; }

  .nav-links {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .nav-link {
    position: relative;
    font-size: 0.92rem;
    font-weight: 400;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 6px 14px;
    border-radius: 100px;
    user-select: none;
    white-space: nowrap;
    transition: color 0.2s;
  }

  .nav-link .char {
    display: inline-block;
    font-weight: 400;
    transition: font-weight 0.15s;
    pointer-events: auto;
  }

  .nav-link .char.bold {
    font-weight: 700;
    color: var(--text-primary);
  }

  .nav-link.active .char {
    font-weight: 700;
    color: var(--text-primary);
  }

  .nav-link.active {
    color: var(--accent);
  }

  .nav-divider {
    width: 1px;
    height: 18px;
    background: var(--glass-border);
    margin: 0 4px;
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .nav-actions-divider {
    width: 1px;
    height: 16px;
    background: var(--glass-border);
    flex-shrink: 0;
  }

  .theme-btn {
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.3s, transform 0.5s;
    border-radius: 8px;
  }
  .theme-btn:hover { color: var(--accent); }
  .theme-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .lang-btn {
    width: 32px;
    height: 30px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: color 0.3s;
    border-radius: 8px;
    user-select: none;
    line-height: 1;
  }
  .lang-btn:hover { color: var(--accent); }

  /* ========== GLASS FRAME CONTAINER — fills page-wrapper ========== */
  .app-container {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 1;
    pointer-events: auto;
    z-index: 10;
    min-height: 0;
  }

  .glass-frame {
    width: 100%;
    height: 100%;
    background: var(--glass-bg);
    backdrop-filter: blur(32px) saturate(1.2);
    -webkit-backdrop-filter: blur(32px) saturate(1.2);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 80px rgba(0,0,0,0.4);
    transition: background 0.45s cubic-bezier(0.4,0,0.2,1), border-color 0.45s cubic-bezier(0.4,0,0.2,1);
  }

  .main-content {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x proximity;
    scroll-behavior: smooth;
    z-index: 1;
    transition: opacity 0.8s ease;
  }

  .main-content::-webkit-scrollbar { display: none; }
  .main-content { -ms-overflow-style: none; scrollbar-width: none; }

  .main-content.faded {
    opacity: 0;
    pointer-events: none;
    z-index: 0;
  }

  .main__inner {
    display: flex;
    height: 100%;
    width: 700vw;
  }

  /* ========== HORIZONTAL PAGES ========== */
  .page {
    min-width: 100vw;
    height: 100%;
    position: relative;
    overflow-y: auto;
    scroll-snap-align: start;
    /* 内容从顶部开始，溢出时可竖向滚动 */
    padding-top: 60px;
    padding-bottom: 60px;
  }

  .page__bg {
    position: absolute;
    inset: 0;
    background: #2a2a2a;
    opacity: 0.8;
  }

  .page__content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 40px;
    max-width: 680px;
    margin: 0 auto;
    width: 100%;
  }

  .page__title {
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 20px;
    letter-spacing: -0.02em;
  }

  .page__title .accent { color: var(--accent); }

  .page__desc {
    font-size: 1.05rem;
    color: var(--text-secondary);
    line-height: 1.7;
  }


  /* ========== VERTICAL FRAMEWORK — inside page-wrapper ========== */
  .vertical-framework {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s, visibility 0.8s;
    z-index: 0;
    scroll-behavior: smooth;
    border-radius: 28px;
  }

  .vertical-framework.is-visible {
    opacity: 1;
    visibility: visible;
    z-index: 2;
  }

  .vf-page {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
  }

  .vf-inner {
    max-width: 900px;
    width: 100%;
  }

  .vf-title {
    font-size: clamp(1.8rem, 3.5vw, 2.6rem);
    font-weight: 800;
    margin-bottom: 32px;
    letter-spacing: -0.02em;
  }

  .vf-title .accent { color: var(--accent); }

  .vf-text {
    font-size: 1rem;
    color: var(--text-secondary);
    line-height: 1.8;
  }

  /* ========== SCROLL HINT ========== */
  .scroll-hint {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 1;
    transition: opacity 0.4s;
  }

  
  .scroll-hint__text {
    font-size: 0.72rem;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    transition: color 0.3s;
  }
.
