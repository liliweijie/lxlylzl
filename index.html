  // ========== PER-CHARACTER HOVER BOLD ==========

        if (e.clientX >= rect.left && e.clientX <= rect.right) {
          hoveredIdx = i;
        }
      });

      chars.forEach(function(ch, i) {
        ch.classList.toggle('bold', i === hoveredIdx);
      });

      chars.forEach(function(ch) {
        ch.classList.remove('bold');

  // ========== THEME TOGGLE ==========
  function getPreferredTheme() {
    var stored = localStorage.getItem('theme');
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    var iconSun = themeBtn.querySelector('.icon-sun');
    var iconMoon = themeBtn.querySelector('.icon-moon');
    if (theme === 'light') {
      iconSun.style.display = '';
      iconMoon.style.display = 'none';
    } else {
      iconSun.style.display = 'none';
      iconMoon.style.display = '';
    }
  }

  // Switch logo image based on theme
  var logoImg = document.getElementById('logoBtn');
  function switchLogo(theme) {
    if (!logoImg || !logoImg.tagName || logoImg.tagName.toLowerCase() !== 'img') return;
    logoImg.src = theme === 'light' ? 'logo-light.svg' : 'logo.svg';
  }
  // Store original applyTheme and wrap it
  var _origApplyTheme = applyTheme;
  applyTheme = function(theme) {
    _origApplyTheme(theme);

  themeBtn.addEventListener('click', function() {

  // ========== SCROLL TO PAGE ==========
  function scrollToPage(idx) {
    if (idx < 0 || idx >= PAGE_COUNT) return;

    mainContent.scrollTo({ left: idx * pageWidth, behavior: 'smooth' });

    if (idx === 1) {
      var tryInit = function() {
        if (window.initWorks3D) window.initWorks3D();
      };

      var onScrollEnd = function() {
        mainContent.removeEventListener('scrollend', onScrollEnd);
        setTimeout(tryInit, 80);
      };
      if ('onscrollend' in mainContent) {
        mainContent.addEventListener('scrollend', onScrollEnd);
      }
      // 如果 scrollend 事件不支持，800ms 后兜底初始化
      setTimeout(tryInit, 800);

  // ========== WHEEL HANDLER �?�湔?�?�皛?蔭�唳赤�?��剁��??�扳�撟單�嚗?==========
  var _navUpdateTimer = null;

  mainContent.addEventListener('wheel', function(e) {
    if (inVerticalFramework) return;
    if (e.ctrlKey) return;
    // 餈?誘敺桀�皛??嚗?圻�扳?�??嚗?    if (Math.abs(e.deltaY) < 1.5 && Math.abs(e.deltaX) < 1.5) return;

    e.preventDefault();

    // �湔?霈曄蔭 scrollLeft嚗?��函?嚗?��桅?��?��其��瑕?皛??�?    var maxScroll = mainContent.scrollWidth - mainContent.clientWidth;
    mainContent.scrollLeft = Math.max(0, Math.min(mainContent.scrollLeft + e.deltaY * 3, maxScroll));
    
    // 撖潸?擃?漁嚗?�瘚?�
    clearTimeout(_navUpdateTimer);
    _navUpdateTimer = setTimeout(function() {
      var pw = mainContent.clientWidth;
      if (pw === 0) return;
      var np = Math.floor((mainContent.scrollLeft + pw / 2) / pw);
      np = Math.max(0, Math.min(np, PAGE_COUNT - 1));
      if (np !== currentPage) {
        currentPage = np;
        updateNavState();

        if (np === 1) {

        }
      }
    }, 60);
  }, { passive: false });

  // ��?�憿菜��啣� �?餈??蝡?�獢??
  var lastPageEnterTimer = null;
  mainContent.addEventListener('wheel', function(e) {
    if (inVerticalFramework) return;
    if (currentPage !== PAGE_COUNT - 1) return;
    if (e.deltaY < 0) return;
    var maxScroll = mainContent.scrollWidth - mainContent.clientWidth;
    if (mainContent.scrollLeft >= maxScroll - 5) {
      if (lastPageEnterTimer) return;
      lastPageEnterTimer = setTimeout(function() { lastPageEnterTimer = null; }, 1500);
      enterVerticalFramework();
    }
  }, { passive: true });

  // ========== FRAMEWORK TRANSITION ==========
  function enterVerticalFramework(done) {
    if (inVerticalFramework) { if (done) done(); return; }
    inVerticalFramework = true;
    lastHorizontalPage = currentPage;  // 霈唬�敶?�璅芸�憿菟?
    mainContent.classList.add('faded');
    // Wait for fade-out transition, then show vertical framework (slower)
    setTimeout(function() {
      verticalFw.classList.add('is-visible');
      verticalFw.scrollTop = 0;
      updateNavState();
      if (done) done();
    }, 800);
  }

  // Wheel handler INSIDE vertical framework: scroll up at top �?exit back to last horizontal page
  var _vfWheelTimer = null;
  verticalFw.addEventListener('wheel', function(e) {
    if (!inVerticalFramework) return;
    if (e.ctrlKey) return;
    // At top and scrolling up �?exit to last horizontal page (獢?� = page4)
    if (verticalFw.scrollTop <= 0 && e.deltaY < 0) {
      e.preventDefault();
      if (_vfWheelTimer) return;
      _vfWheelTimer = setTimeout(function() { _vfWheelTimer = null; }, 1200);

            exitVerticalFramework(function() {
          scrollToPage(lastHorizontalPage);
        });

  function exitVerticalFramework(done) {
    if (!inVerticalFramework) { if (done) done(); return; }
    inVerticalFramework = false;
    // Fade out vertical framework first (400ms transition)
    verticalFw.classList.remove('is-visible');

    setTimeout(function() {
      mainContent.classList.remove('faded');
      updateNavState();
      if (done) done();
    }, 800);
  }

  // ========== NAV CLICK ==========
  navLinks.forEach(function(item) {
    item.addEventListener('click', function() {
      var target = item.dataset.target;
      var idx = parseInt(item.dataset.index, 10);

      if (target === 'page') {
        if (inVerticalFramework) {
          exitVerticalFramework(function() {
            scrollToPage(idx);

        } else {

  logoBtn.addEventListener('click', function() {

function initWorks3D() {
  if (worksInitialized) return;
  worksView = document.querySelector('.works-3d-view');
  worksStage = document.querySelector('.works-3d-stage');
  if (!worksView || !worksStage) return;

  if (worksView.offsetWidth < 10 || worksView.offsetHeight < 10) {
    setTimeout(initWorks3D, 200);
    return;
  }

  worksViewWidth = worksView.offsetWidth;
  worksViewCenter = worksViewWidth / 2;
  worksMouseX = worksViewCenter;
  worksInitialized = true;

  for (var i = 0; i < WORKS_NUM; i++) {
    var themes = getWorksThemes();
    var theme = themes[i % themes.length];
    var cardData = WORKS_CARDS_DATA[i];
    var el = document.createElement('div');
    el.className = 'card-3d';
    el.dataset.idx = i;
    el.style.background = theme.bg;
    el.style.color = theme.fg;
    el.innerHTML =
      '<div class="card-inner">' +
        '<span class="card-label">' + theme.bg.toUpperCase() + '</span>' +
        '<div class="card-title-area"><span class="card-title">' + cardData.title + '</span></div>' +
        '<div class="card-num">' + (i+1) + '</div>' +
        '<div class="card-line"></div>' +
        '<span class="card-info">' + cardData.info + '</span>' +
        '<span class="card-footer">' + cardData.footer + '</span>' +
      '</div>';
    worksStage.appendChild(el);

    (function(idx) {
      el.addEventListener('mouseenter', function() { worksHoveredIdx = idx; });
      el.addEventListener('mouseleave', function() { worksHoveredIdx = -1; });
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        openWorksPopup(idx);
      });
    })(i);

    worksCards.push({el: el, idx: i});
  }

  worksWheelHandler = function(e) {
    if (!worksInitialized) return;
    var halfSpread = (WORKS_NUM - 1) * WORKS_BASE_GAP / 2;
    var maxScroll = Math.max(halfSpread, worksViewWidth * 0.45);
    var atLeft  = worksTargetScrollX <= -maxScroll + 2;
    var atRight = worksTargetScrollX >=  maxScroll - 2;
    var scrollingDown = e.deltaY > 0;
    var scrollingUp   = e.deltaY < 0;

    if ((atRight && scrollingDown) || (atLeft && scrollingUp)) {
      e.preventDefault();
      e.stopPropagation();
      if (window.scrollToPage && window.getCurrentPage) {
        var cp = window.getCurrentPage();
        window.scrollToPage(scrollingDown ? cp + 1 : cp - 1);
      }
      return;
    }

    e.preventDefault();
    e.stopPropagation();
    worksTargetScrollX += e.deltaY * 3.5;
  };
  worksView.addEventListener('wheel', worksWheelHandler, {passive: false});

  worksMousemoveHandler = function(e) {
    var rect = worksView.getBoundingClientRect();
    worksMouseX = e.clientX - rect.left;
  };
  worksView.addEventListener('mousemove', worksMousemoveHandler);

  worksMouseleaveHandler = function() { worksMouseX = worksViewCenter; };
  worksView.addEventListener('mouseleave', worksMouseleaveHandler);

function destroyWorks3D() {
  if (worksAnimFrame) { cancelAnimationFrame(worksAnimFrame); worksAnimFrame = null; }
  worksInitialized = false;
  worksCards = [];
  worksScrollX = 0; worksTargetScrollX = 0;

  if (worksView) {
    if (worksWheelHandler)     worksView.removeEventListener('wheel', worksWheelHandler);
    if (worksMousemoveHandler) worksView.removeEventListener('mousemove', worksMousemoveHandler);
    if (worksMouseleaveHandler) worksView.removeEventListener('mouseleave', worksMouseleaveHandler);
  }
  worksWheelHandler = null;
  worksMousemoveHandler = null;
  worksMouseleaveHandler = null;
  worksView = null;

  if (worksStage) { worksStage.innerHTML = ''; }
  console.log('[works-3d] destroyed');
}

function worksFisheye(x) {
  var absX = Math.abs(x);
  if (absX > WORKS_FOCUS_RANGE) return x;
  var t = 1 - absX / WORKS_FOCUS_RANGE;
  var boost = 1 + WORKS_FISHEYE * t * t;
  return x * boost;
}

function updateWorks3D() {
  worksScrollX += (worksTargetScrollX - worksScrollX) * 0.05;
  var halfSpread = (WORKS_NUM - 1) * WORKS_BASE_GAP / 2;
  var maxScroll = Math.max(halfSpread, worksViewWidth * 0.45);
  if (worksScrollX > maxScroll) worksScrollX = maxScroll;
  if (worksScrollX < -maxScroll) worksScrollX = -maxScroll;
  if (worksTargetScrollX > maxScroll) worksTargetScrollX = maxScroll;
  if (worksTargetScrollX < -maxScroll) worksTargetScrollX = -maxScroll;

  var positions = [];
  for (var i = 0; i < WORKS_NUM; i++) {
    var logicalX = (i - (WORKS_NUM - 1) / 2) * WORKS_BASE_GAP + worksScrollX;
    var visualX = worksFisheye(logicalX);
    var screenX = worksViewCenter + visualX;
    var dist = Math.abs(screenX - worksMouseX);
    var z = WORKS_MIN_Z;
    if (dist < WORKS_FOCUS_RANGE) {
      var t = 1 - dist / WORKS_FOCUS_RANGE;
      z = WORKS_MIN_Z + (WORKS_MAX_Z - WORKS_MIN_Z) * Math.pow(t, 1.3);
    }
    positions.push({visualX: visualX, z: z, screenX: screenX});
  }

  var closestIdx = 0, closestDist = Infinity;
  for (var i = 0; i < WORKS_NUM; i++) {
    var d = Math.abs(positions[i].screenX - worksMouseX);
    if (d < closestDist) { closestDist = d; closestIdx = i; }
  }

  for (var i = 0; i < WORKS_NUM; i++) {
    var el = worksCards[i].el;
    var pos = positions[i];
    var tz = pos.z;
    if (parseInt(el.dataset.idx) === worksHoveredIdx) tz += 30;
    el.style.transform = 'translateX(' + pos.visualX + 'px) translateY(-50%) translateZ(' + tz + 'px)';
    el.style.zIndex = Math.round(-tz + 1000);
    if (i === closestIdx) {
      el.style.boxShadow = '-4px 2px 20px rgba(0,0,0,0.3)';
    } else {
      el.style.boxShadow = '0 1px 8px rgba(0,0,0,0.12)';
    }
  }

  worksAnimFrame = requestAnimationFrame(updateWorks3D);
}

function openWorksPopup(idx) {
  var themes = getWorksThemes();
  var theme = themes[idx % themes.length];
  var cardData = WORKS_CARDS_DATA[idx];
  var overlay = document.querySelector('.works-popup-overlay');
  var panel = overlay.querySelector('.works-popup-panel');
  panel.querySelector('h1').textContent = cardData.title;
  panel.querySelector('p').textContent = cardData.info;
  var preview = panel.querySelector('.works-popup-preview');
  preview.style.background = theme.bg;
  preview.style.color = theme.fg;
  preview.textContent = cardData.title + ' �?憸?�';
  overlay.style.opacity = '1';
  overlay.style.visibility = 'visible';
  overlay.style.pointerEvents = 'auto';
  panel.style.transform = 'translateX(0)';
}

function closeWorksPopup() {
  var overlay = document.querySelector('.works-popup-overlay');
  if (overlay) {
    overlay.style.opacity = '0';
    overlay.style.visibility = 'hidden';
    overlay.style.pointerEvents = 'none';
    overlay.querySelector('.works-popup-panel').style.transform = 'translateX(100%)';
  }
}




  /* Auto init/destroy 3D cards based on currentPage */
  (function() {
    setInterval(function() {
      if (currentPage === 1 && !worksInitialized) {
        initWorks3D();
      } else if (currentPage !== 1 && worksInitialized) {
        destroyWorks3D();
      }
    }, 300);
    // Initial check
    setTimeout(function() {
      if (currentPage === 1) initWorks3D();
    }, 800);
  })();
    window.scrollToPage = scrollToPage;
  window.getCurrentPage = function() { return currentPage; };

})();
