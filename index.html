<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>liliweijie - 平面设计师</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ========== RESET & BASE ========== */
  *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }

  :root {
    --accent: #E85D3B;
    --accent-glow: rgba(232,93,59,0.3);
    --accent-yellow: #F4C430;
    --accent-gold: #B8860B;
    --accent-red: #DC143C;
    --gradient-accent: linear-gradient(135deg, #E85D3B, #DC143C);
    --gradient-warm: linear-gradient(135deg, #F4C430, #E85D3B);
    --glass-bg: rgba(10,10,10,0.78);
    --glass-border: rgba(255,255,255,0.07);
    --text-primary: #F0EDE8;
    --text-secondary: #9A9590;
    --text-muted: #5A5550;
    --bg-primary: #0A0A0A;
    --nav-bg: rgba(10,10,10,0.65);
    --page-bg: rgba(20,20,20,0.88);
    --card-bg: rgba(255,255,255,0.03);
    /* 卡片模块垂直偏移：改这个数字来上下移动整个卡片模块 */
    /* 正数 = 向下移，负数 = 向上移，单位 px */
    --card-top: 50px;
  }

  [data-theme="light"] {
    --glass-bg: rgba(255,255,255,0.78);
    --glass-border: rgba(0,0,0,0.08);
    --text-primary: #1A1816;
    --text-secondary: #6A6560;
    --text-muted: #9A9590;
    --bg-primary: #FAF8F5;
    --nav-bg: rgba(250,248,245,0.65);
    --page-bg: rgba(250,248,245,0.82);
    --card-bg: rgba(0,0,0,0.025);
  }

  html { font-size: 16px; }

  body {
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow: hidden;
    height: 100vh;
    transition: background 0.45s cubic-bezier(0.4,0,0.2,1), color 0.45s cubic-bezier(0.4,0,0.2,1);
  }

  /* ========== PAGE WRAPPER — below nav, max size ========== */
  .page-wrapper {
    position: fixed;
    top: 52px; left: 72px; right: 72px; bottom: 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }

  /* ========== TOP NAV — fixed at viewport top ========== */
  .top-nav {
    position: fixed;
    top: 2px; left: 72px; right: 72px;
    height: 47px;
    z-index: 1000;
    pointer-events: none;
    display: flex;
    align-items: center;
  }

  .top-nav * { pointer-events: auto; }

  .nav-section {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 18px;
    background: var(--nav-bg);
    backdrop-filter: blur(32px) saturate(1.2);
    -webkit-backdrop-filter: blur(32px) saturate(1.2);
    border: 1px solid var(--glass-border);
    border-radius: 100px;
    transition: background 0.3s, border-color 0.3s;
    box-sizing: border-box;
    height: 42px;
  }

  .nav-left  { position: absolute; top: 50%; left: 0; transform: translateY(-50%); }
  .nav-center {
    position: absolute; top: 50%;
    left: 50%; transform: translate(-50%, -50%);
  }
  .nav-right { position: absolute; top: 50%; right: 0; transform: translateY(-50%); }

  .nav-logo {
    height: 26px;
    width: auto;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.2s;
    object-fit: contain;
  }
  .nav-logo:hover { opacity: 0.7; }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .nav-link {
    position: relative;
    font-size: 0.92rem;
    font-weight: 400;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 6px 14px;
    border-radius: 100px;
    user-select: none;
    white-space: nowrap;
    text-decoration: none;
    transition: color 0.2s;
  }

  .nav-link .char {
    display: inline-block;
    font-weight: 400;
    transition: font-weight 0.15s;
    pointer-events: auto;
  }

  .nav-link .char.bold {
    font-weight: 700;
    color: var(--text-primary);
  }

  .nav-link.active .char {
    font-weight: 700;
    color: var(--text-primary);
  }

  .nav-link.active {
    color: var(--accent);
  }

  .nav-divider {
    width: 1px;
    height: 18px;
    background: var(--glass-border);
    margin: 0 4px;
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .nav-actions-divider {
    width: 1px;
    height: 16px;
    background: var(--glass-border);
    flex-shrink: 0;
  }

  .theme-btn {
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.3s, transform 0.5s;
    border-radius: 8px;
  }
  .theme-btn:hover { color: var(--accent); }
  .theme-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .lang-btn {
    width: 32px;
    height: 30px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: color 0.3s;
    border-radius: 8px;
    user-select: none;
    line-height: 1;
  }
  .lang-btn:hover { color: var(--accent); }

  /* ========== GLASS FRAME CONTAINER — fills page-wrapper ========== */
  .app-container {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 1;
    pointer-events: auto;
    z-index: 10;
    min-height: 0;
  }

  .glass-frame {
    width: 100%;
    height: 100%;
    background: var(--glass-bg);
    backdrop-filter: blur(32px) saturate(1.2);
    -webkit-backdrop-filter: blur(32px) saturate(1.2);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 80px rgba(0,0,0,0.4);
    transition: background 0.45s cubic-bezier(0.4,0,0.2,1), border-color 0.45s cubic-bezier(0.4,0,0.2,1);
  }

  .main-content {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    z-index: 1;
    transition: opacity 0.8s ease;
  }

  .main-content::-webkit-scrollbar { display: none; }
  .main-content { -ms-overflow-style: none; scrollbar-width: none; }

  .main-content.faded {
    opacity: 0;
    pointer-events: none;
    z-index: 0;
  }

  .main__inner {
    display: flex;
    height: 100%;
    width: 700vw;
  }

  /* ========== HORIZONTAL PAGES ========== */
  .page {
    min-width: 100vw;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
      overflow: hidden;
  }

  .page__bg {
    position: absolute;
    inset: 0;
    background: var(--page-bg);
  }

  .page__content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 40px;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  /* ========== PAGE SCROLL FRAME ========== */
  .page__scroll-frame {
    width: 100%;
    overflow-y: hidden !important;
    overflow-x: hidden;
    padding-right: 8px;
  }

  .page__title {
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 20px;
    letter-spacing: -0.02em;
  }

  .page__title .accent { color: var(--accent); }

  .page__desc {
    font-size: 1.05rem;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  /* ========== VERTICAL FRAMEWORK — inside page-wrapper ========== */
  .vertical-framework {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s, visibility 0.8s;
    z-index: 0;
    border-radius: 28px;
    scroll-snap-type: y mandatory;
    -webkit-scroll-snap-type: y mandatory;
  }

  .vertical-framework.is-visible {
    opacity: 1;
    visibility: visible;
    z-index: 2;
  }

  .vf-page {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }

  .vf-inner {
    max-width: 900px;
    width: 100%;
  }

  .vf-title {
    font-size: clamp(1.8rem, 3.5vw, 2.6rem);
    font-weight: 800;
    margin-bottom: 32px;
    letter-spacing: -0.02em;
  }

  .vf-title .accent { color: var(--accent); }

  .vf-text {
    font-size: 1rem;
    color: var(--text-secondary);
    line-height: 1.8;
  }

  /* ========== SPLIT 4:6 — inside vertical framework (shared by portfolio + all split pages) ========== */
  .vf-page--split {
    min-height: 100% !important;
    height: 100% !important;
    padding: 0 !important;
    overflow: hidden !important;
    align-items: stretch !important;
    scroll-snap-align: start;
  }

  .split-viewport {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    display: flex;
  }

  .vf-page--split .vf-inner {
    max-width: none;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* page-specific split card styles */
  .pf-service-list { display: flex; flex-direction: column; gap: 10px; }
  .pf-service-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: var(--card-bg);
    border: 1px solid var(--glass-border); border-radius: 12px;
    font-size: 0.88rem; font-weight: 500; transition: border-color 0.3s;
  }
  .pf-service-item:hover { border-color: var(--accent); }
  .pf-service-item .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0;
  }

  .pf-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .pf-stat-card {
    display: flex; flex-direction: column; gap: 4px; align-items: center;
    padding: 16px 12px; background: var(--card-bg);
    border: 1px solid var(--glass-border); border-radius: 12px;
    transition: border-color 0.3s;
  }
  .pf-stat-card:hover { border-color: var(--accent); }
  .pf-stat-card .num { font-size: 1.6rem; font-weight: 800; color: var(--accent); }
  .pf-stat-card .label { font-size: 0.7rem; color: var(--text-muted); }

  .pf-blog-list { display: flex; flex-direction: column; gap: 8px; }
  .pf-blog-item {
    padding: 14px 16px; background: var(--card-bg);
    border: 1px solid var(--glass-border); border-radius: 12px;
    cursor: pointer; transition: border-color 0.3s, transform 0.3s;
  }
  .pf-blog-item:hover, .pf-blog-item.active { border-color: var(--accent); transform: translateX(6px); }
  .pf-blog-item .date { font-size: 0.65rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; font-family: "Inter", sans-serif; }
  .pf-blog-item .title { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; }
  .pf-blog-item .excerpt { font-size: 0.75rem; color: var(--text-muted); line-height: 1.5; }

  .pf-blog-preview { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 24px; }
  .pf-blog-preview .date { font-size: 0.7rem; color: var(--accent); font-weight: 600; margin-bottom: 8px; font-family: "Inter", sans-serif; }
  .pf-blog-preview .title { font-size: 1.25rem; font-weight: 800; margin-bottom: 16px; line-height: 1.3; }
  .pf-blog-preview .body { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.8; margin-bottom: 16px; }
  .pf-blog-preview .read-more {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.8rem; font-weight: 600; color: var(--accent); cursor: pointer;
    transition: gap 0.3s;
  }
  .pf-blog-preview .read-more:hover { gap: 10px; }

  .pf-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .pf-tag-chip {
    padding: 7px 16px; background: var(--card-bg); border: 1px solid var(--glass-border);
    border-radius: 100px; font-size: 0.75rem; font-weight: 500; color: var(--text-secondary);
    cursor: pointer; transition: border-color 0.3s, color 0.3s;
  }
  .pf-tag-chip:hover { border-color: var(--accent); color: var(--text-primary); }

  .pf-skills-col { display: flex; flex-direction: column; gap: 18px; }
  .pf-skill-row { display: flex; flex-direction: column; gap: 6px; }
  .pf-skill-row .head { display: flex; justify-content: space-between; font-size: 0.85rem; }
  .pf-skill-row .head .name { font-weight: 600; }
  .pf-skill-row .head .pct { color: var(--text-muted); font-family: "Inter", sans-serif; }
  .pf-skill-row .bar { height: 4px; background: var(--card-bg); border-radius: 2px; overflow: hidden; }
  .pf-skill-row .bar .fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 1.2s cubic-bezier(0.16,1,0.3,1); }

  .pf-process-intro { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.7; margin-bottom: 16px; }
  .pf-process-highlights { display: flex; flex-direction: column; gap: 8px; }
  .pf-process-hl {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.82rem; color: var(--text-secondary);
    padding: 8px 12px; background: var(--card-bg);
    border: 1px solid var(--glass-border); border-radius: 10px;
    transition: border-color 0.3s;
  }
  .pf-process-hl:hover { border-color: var(--accent); }
  .pf-process-hl .icon { color: var(--accent); flex-shrink: 0; font-weight: 700; }

  .pf-timeline-list { display: flex; flex-direction: column; gap: 6px; }
  .pf-timeline-item {
    display: flex; gap: 16px; padding: 10px 14px;
    background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 10px;
    transition: border-color 0.3s;
  }
  .pf-timeline-item:hover { border-color: var(--accent); }
  .pf-timeline-item .step {
    font-size: 0.65rem; font-weight: 700; color: var(--accent);
    min-width: 52px; font-family: "Inter", sans-serif; flex-shrink: 0;
  }
  .pf-timeline-item .info .tl-title { font-size: 0.88rem; font-weight: 700; margin-bottom: 2px; }
  .pf-timeline-item .info .tl-desc { font-size: 0.72rem; color: var(--text-muted); line-height: 1.5; }

  /* Responsive for split pages */
  @media (max-width: 768px) {
    .split-viewport { flex-direction: column; }
    .vf-page--split .pf-left, .vf-page--split .pf-right { width: 100%; height: 50%; border-right: none; border-bottom: 1px solid var(--glass-border); }
    .vf-page--split .pf-right { border-bottom: none; }
  }

  .pf-panel {
    position: relative;
    height: 100%;
    overflow: hidden;
  }

  .pf-left {
    width: 40%;
    flex-shrink: 0;
    border-right: 1px solid var(--glass-border);
  }

  .pf-right {
    width: 60%;
    flex-shrink: 0;
  }

  .pf-track {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    will-change: transform;
    transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .pf-item {
    position: relative;
    width: 100%;
    flex: 0 0 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(32px, 5vh, 60px) clamp(24px, 4vw, 48px);
    overflow: hidden;
  }

  .pf-right .pf-item {
    padding: clamp(32px, 5vh, 60px) clamp(32px, 5vw, 60px);
  }

  .pf-tag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: fit-content;
    padding: 6px 14px;
    background: rgba(192,57,43,0.18);
    border-radius: 100px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin-bottom: 16px;
  }

  .pf-section-label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    flex-shrink: 0;
  }
  .pf-section-label .num {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--accent);
    font-family: "Inter", sans-serif;
  }
  .pf-section-label .title {
    font-size: 1.45rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .pf-card {
    background: var(--card-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 24px;
    transition: border-color 0.3s;
    overflow: hidden;
  }
  .pf-card:hover { border-color: var(--accent); }

  .pf-hero-name {
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 900;
    line-height: 1.05;
    margin-bottom: 14px;
    letter-spacing: 0.04em;
  }
  .pf-hero-subtitle {
    font-size: 1rem;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .pf-hero-desc {
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 380px;
    margin-bottom: 22px;
  }
  .pf-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 144px;
    height: 42px;
    background: var(--accent);
    color: #fff;
    border-radius: 100px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .pf-cta:hover {
    transform: scale(1.06);
    box-shadow: 0 8px 30px rgba(192,57,43,0.35);
  }

  .pf-about-bio {
    font-size: 0.85rem;
    color: var(--text-secondary);
    line-height: 1.7;
    margin-bottom: 18px;
  }
  .pf-about-stats {
    display: flex;
    gap: 28px;
    margin-bottom: 18px;
  }
  .pf-about-stat { display: flex; flex-direction: column; gap: 4px; }
  .pf-about-stat .num { font-size: 1.9rem; font-weight: 800; line-height: 1; }
  .pf-about-stat .label { font-size: 0.7rem; color: var(--text-muted); }
  .pf-about-awards {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(192,57,43,0.1);
    border-radius: 8px;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--accent);
  }

  .pf-works-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pf-works-item {
    padding: 12px 14px;
    background: var(--card-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    cursor: pointer;
    transition: border-color 0.3s, background 0.3s, transform 0.3s;
  }
  .pf-works-item:hover, .pf-works-item.active {
    border-color: var(--accent);
    background: rgba(255,255,255,0.05);
    transform: translateX(6px);
  }
  .pf-works-item .cat {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.04em;
    margin-bottom: 4px;
    font-family: "Inter", sans-serif;
  }
  .pf-works-item .name { font-size: 1rem; font-weight: 700; }

  .pf-showcase-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    flex: 1;
    min-height: 0;
  }
  .pf-showcase-card {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 14px;
    background: var(--card-bg);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    transition: border-color 0.3s, transform 0.3s;
    min-height: 0;
  }
  .pf-showcase-card:hover { border-color: var(--accent); transform: translateY(-4px); }
  .pf-showcase-card .cat {
    font-size: 0.62rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.04em;
    font-family: "Inter", sans-serif;
    flex-shrink: 0;
  }
  .pf-showcase-card .title { font-size: 1rem; font-weight: 800; flex-shrink: 0; }
  .pf-showcase-card .desc {
    font-size: 0.72rem;
    color: var(--text-muted);
    line-height: 1.5;
    flex-shrink: 0;
  }
  .pf-showcase-preview {
    flex: 1;
    min-height: 50px;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    margin-top: 6px;
  }

  .pf-exp-list {
    display: flex;
    flex-direction: column;

  /* ========== HOVER FIXES ========== */

  /* ========== 3D CARDS ========== */
  /* 结构：page 撑满 → content 撑满 → content 用 flex 居中卡片视图 */
  .page--works {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: 100vw !important;
    height: 100% !important;
    position: relative !important;
  }
  .page--works .page__content {
    width: 100% !important;
    max-width: none !important;
    height: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    position: relative !important;
  }
  /* 卡片视图：距离内容模块顶部 350px，不裁切 */
  .works-3d-view {
    width: 100%;
    height: calc(100% - 100px);
    margin-top: 100px;
    overflow: visible;
    position: relative;
  }
  .works-3d-stage {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    perspective: 750px;
    overflow: visible;
  }
  /* 作品集页不裁切卡片 */
  .page--works { overflow: visible !important; }
  .page--works .page__content { overflow: visible !important; }
  
  /* ========== HERO LOADING OVERLAY — 开屏 Loading 页 ========== */
  /* 默认显示 Loading，不依赖 JS 初始化 */
  .hero-loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    opacity: 1;
  }
  .hero-loading-overlay.light { background: #ffffff; }
  .hero-loading-overlay.dark  { background: #0e0e12; }
  /* Loading 结束后淡出 — 更平滑的淡出 */
  .hero-loading-overlay.fade-out {
    opacity: 0 !important;
    pointer-events: none;
    transition: opacity 0.1s ease;
  }
  /* Loading 完全结束后从 DOM 流中移除 */
  .hero-loading-overlay.hidden {
    display: none !important;
  }

  /* Logo SVG 容器：整体放大+消失 */
  .hero-loading-logo {
    width: 120px;
    height: 120px;
    animation: logoScale 0.8s ease-in-out forwards;
  }
  /* 0.8秒：容器从小变大消失 */
  @keyframes logoScale {
    0% {
      opacity: 1;
      transform: scale(0.3);
    }
    100% {
      opacity: 0;
      transform: scale(4);
    }
  }

  /* 填充层：开始可见，逐渐消失 */
  .logo-filled {
    animation: fillFadeOut 0.8s ease-in-out forwards;
  }
  @keyframes fillFadeOut {
    0% { fill-opacity: 0.75; }
    100% { fill-opacity: 0; }
  }

  /* 描边层：开始不可见，逐渐显示 */
  .logo-outline {
    animation: strokeFadeIn 0.8s ease-in-out forwards;
  }
  @keyframes strokeFadeIn {
    0% { stroke-opacity: 0; }
    100% { stroke-opacity: 0.75; }
  }

  /* ========== 页面内容默认隐藏（Loading 期间） ========== */
  .top-nav,
  .page-wrapper,
  .main-wrapper {
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  /* Loading 结束后显示页面内容 */
  body.hero-loaded .top-nav,
  body.hero-loaded .page-wrapper,
  body.hero-loaded .main-wrapper {
    opacity: 1;
  }

  .page--hero .page__content {
    max-width: none !important;
    width: 100% !important;
    height: 100% !important;
    padding: 0 !important;
    position: relative !important;
    overflow: hidden !important;
  }
  /* 阶段2+3: 文件卡片容器 */
  .hero-files {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  /* 文件卡片基础样式 */
  .hero-file {
    position: absolute;
    border-radius: 6px;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.35),
      0 2px 8px rgba(0,0,0,0.18);
    pointer-events: auto;
    cursor: grab;
    will-change: transform, left, top, rotate;
    backface-visibility: hidden;
    transition: box-shadow 0.25s, transform 0.25s;
  }
  .hero-file:hover {
    box-shadow:
      0 12px 48px rgba(0,0,0,0.5),
      0 4px 16px rgba(0,0,0,0.25);
    z-index: 100 !important;
  }
  .hero-file:active {
    cursor: grabbing;
  }

  .hero-file--black {
    width: 280px;

    background: #1a1a1e;

    background: none;
    border: 3px solid #fff;
    border-radius: 50%;
    width: 48px; height: 48px;
    font-size: 20px;
  }
  .hero-file--black .hf-label {
    position: absolute;
    bottom: 28px; right: 28px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.7;
  }
  /* 白色文档 */
  .hero-file--white {
    width: 220px;
    height: 310px;
    background: #eae8e2;
    border: 1px solid rgba(0,0,0,0.08);
    color: #222;
    padding: 24px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .hero-file--white .hf-line {
    height: 8px;
    background: rgba(0,0,0,0.08);
    margin-bottom: 10px;
    border-radius: 2px;
  }
  .hero-file--white .hf-line--short { width: 55%; }
  .hero-file--white .hf-line--medium { width: 80%; }
  .hero-file--white .hf-line--long { width: 95%; }
  .hero-file--white .hf-badge {
    display: inline-block;
    padding: 4px 14px;
    background: #fff;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 16px;
    border: 1px solid rgba(0,0,0,0.1);
  }
  /* 深色小卡片 */
  .hero-file--dark-card {
    width: 180px;
    height: 240px;
    background: #111114;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    color: #fff;
    font-family: monospace;
    font-size: 11px;
  }
  .hero-file--dark-card .hf-circle {
    width: 80px; height: 80px;
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
  }
  .hero-file--dark-card .hf-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    width: 100%;
  }
  .hero-file--dark-cell {
    height: 20px;
    background: rgba(255,255,255,0.04);
    border-radius: 3px;
  }
  /* 蓝色文件夹 */
  .hero-file--blue-folder {
    width: 200px;
    height: 260px;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    border-radius: 6px 6px 12px 12px;
    position: relative;
  }
  .hero-file--blue-folder::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 40px;
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    border-radius: 6px 6px 0 0;
  }
  .hero-file--blue-folder::after {
    content: '';
    position: absolute;
    top: -8px;
    left: 12px;
    width: 70px;
    height: 16px;
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    border-radius: 4px 4px 0 0;
  }
  .hero-file--blue-folder .hf-tab {
    position: absolute;
    bottom: 24px; left: 20px; right: 20px;
    display: flex;
    justify-content: space-between;
    font-family: system-ui;
    font-size: 12px;
    color: rgba(255,255,255,0.75);
  }
  /* 浅色便签纸 */
  .hero-file--note {
    width: 160px;
    height: 180px;
    background: #fff9c4;
    border: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    padding: 16px;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    font-size: 13px;
    color: #5a4a00;
    transform: rotate(-3deg) !important;
  }
  .hero-file--note .hf-scribble {
    margin-top: 12px;
    width: 100%;
    height: 2px;
    background: #c9b341;
    border-radius: 1px;
  }
  /* 点击提示 */
  .hero-hint {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 13px;
    color: var(--text-muted, #5a5a6a);
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: hintPulse 1.8s ease-in-out infinite;
    z-index: 200;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  /* 飞入动画状态 */
  .hero-file.flying-in {
    transition: left 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                top 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                rotate 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.45s ease;
  }
  .hero-file.scattered {
    transition: left 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                top 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                rotate 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                scale 0.85s ease;
  }
  /* ===== FLUID CURSOR ===== */
  @media (hover: hover) and (pointer: fine) {
    body, a, button, .nav-link, .nav-logo, .hero-file, .skill-badge, .glass-nav-pill { cursor: none; }

    .fluid-cursor {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 9999;
      filter: url(#goo);
      mix-blend-mode: difference;
    }

    .fluid-blob {
      position: absolute;
      top: 0; left: 0;
      border-radius: 50%;
      background: #fff;
      will-change: transform;
    }
    .fluid-blob:nth-child(1) { width: 34px; height: 34px; }
    .fluid-blob:nth-child(2) { width: 28px; height: 28px; }
    .fluid-blob:nth-child(3) { width: 22px; height: 22px; }
    .fluid-blob:nth-child(4) { width: 16px; height: 16px; }

    .fluid-dot {
      position: fixed;
      top: 0; left: 0;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #fff;
      pointer-events: none;
      z-index: 10000;
      will-change: transform;
      mix-blend-mode: difference;
    }
  }

  @media (hover: none), (pointer: coarse) {
    .fluid-cursor, .fluid-dot { display: none; }
  }
</style>
</head>

<script>
(function() {
  'use strict';
  var themeBtn = document.getElementById("themeBtn");
  var logoBtn = document.getElementById("logoBtn");
  function getPreferredTheme() {
    var stored = localStorage.getItem("theme");
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    var iconSun = document.querySelector(".icon-sun");
    var iconMoon = document.querySelector(".icon-moon");
    if (theme === 'light') { iconSun.style.display = ''; iconMoon.style.display = 'none'; }
    else { iconSun.style.display = 'none'; iconMoon.style.display = ''; }
    if (logoBtn) logoBtn.src = theme === 'light' ? 'logo-light.svg' : 'logo.svg';
  }
  applyTheme(getPreferredTheme());
  if (themeBtn) {
    themeBtn.addEventListener("click", function() {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });
  }
})();
</script>

<!-- Fluid Cursor -->
<script>
(function() {
  var fluidBlobs = document.querySelectorAll('.fluid-blob');
  var fluidDot = document.getElementById('fluidDot');
  var blobLerps = [0.30, 0.22, 0.16, 0.10];
  var blobSizes = [34, 28, 22, 16];
  var blobPos = [];
  for (var i = 0; i < fluidBlobs.length; i++) {
    blobPos.push({ x: -200, y: -200 });
  }
  var mouseFX = -200, mouseFY = -200;
  var dotX = -200, dotY = -200;
  var cursorHover = false;

  window.addEventListener('mousemove', function(e) {
    mouseFX = e.clientX;
    mouseFY = e.clientY;
  });

  document.addEventListener('mouseover', function(e) {
    if (e.target.closest('a, button, .nav-link, .nav-logo, .hero-file, .skill-badge')) cursorHover = true;
  });
  document.addEventListener('mouseout', function(e) {
    if (e.target.closest('a, button, .nav-link, .nav-logo, .hero-file, .skill-badge')) cursorHover = false;
  });

  (function update() {
    var hoverScale = cursorHover ? 1.7 : 1.0;
    for (var bi = 0; bi < fluidBlobs.length; bi++) {
      blobPos[bi].x += (mouseFX - blobPos[bi].x) * blobLerps[bi];
      blobPos[bi].y += (mouseFY - blobPos[bi].y) * blobLerps[bi];
      var half = blobSizes[bi] / 2;
      fluidBlobs[bi].style.transform = 'translate(' + (blobPos[bi].x - half) + 'px,' + (blobPos[bi].y - half) + 'px) scale(' + hoverScale + ')';
    }
    dotX += (mouseFX - dotX) * 0.5;
    dotY += (mouseFY - dotY) * 0.5;
    fluidDot.style.transform = 'translate(' + (dotX - 2.5) + 'px,' + (dotY - 2.5) + 'px)';
    requestAnimationFrame(update);
  })();
})();
</script>
