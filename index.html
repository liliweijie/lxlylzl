<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0E0E0E;
    --text: #F9F9F9;
    --text-muted: #DBDBDB;
    --panel: #262626;
    --accent: #F24C30;
    --pill-bg: rgba(255,255,255,0.08);
    --pill-border: rgba(255,255,255,0.14);
    --nav-h: 88px;
  }
  [data-theme="light"] {
    --bg: #F9F9F9;
    --text: #0E0E0E;
    --text-muted: #262626;
    --panel: #DBDBDB;
    --pill-bg: rgba(0,0,0,0.07);
    --pill-border: rgba(0,0,0,0.12);
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', 'Inter', sans-serif;
    overflow: hidden;
    height: 100vh; width: 100vw;
    transition: background 0.45s ease, color 0.45s ease;
  }

  .top-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 20px 40px; pointer-events: none;
  }
  .top-nav * { pointer-events: auto; }
  .nav-center {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 12px;
  }
  .nav-logo-wrap {
    display: flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--pill-bg); border: 1px solid var(--pill-border);
    cursor: pointer; transition: opacity 0.2s, background 0.25s; flex-shrink: 0;
  }
  .nav-logo-wrap:hover { opacity: 0.75; }
  .nav-logo { height: 24px; width: auto; }
  .nav-link {
    display: inline-flex; align-items: center; justify-content: center;
    height: 48px; padding: 0 28px; border-radius: 100px;
    background: var(--pill-bg); border: 1px solid var(--pill-border);
    color: var(--text); text-decoration: none; font-size: 1.05rem; font-weight: 500;
    letter-spacing: 0.06em; white-space: nowrap;
    transition: background 0.25s, border-color 0.25s, transform 0.15s;
  }
  .nav-link:hover { background: var(--panel); border-color: var(--accent); transform: translateY(-1px); }
  .nav-link.is-active { background: var(--panel); border-color: var(--text-muted); font-weight: 600; }
  .theme-btn {
    width: 40px; height: 40px; border: none; background: var(--pill-bg);
    border: 1px solid var(--pill-border); color: var(--text-muted);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: color 0.3s, background 0.25s; border-radius: 50%; flex-shrink: 0;
  }
  .theme-btn:hover { color: var(--accent); background: var(--panel); }
  .theme-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  body, body * { cursor: none !important; }
  #inkLayer { position: fixed; inset: 0; z-index: 9999; pointer-events: none; filter: drop-shadow(0 0 1.5px rgba(255,255,255,0.85)); }
  #inkLayer.is-hidden { opacity: 0; }
  .ink-goo { position: absolute; inset: 0; filter: url(#ink-goo); }
  .ink-blob { position: absolute; top: 0; left: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #0E0E0E; will-change: transform; }

  .page-visual {
    position: absolute; left: 0; right: 0; bottom: 0;
    top: var(--nav-h);
    overflow: hidden;
    z-index: 1;
  }
  .page-visual svg {
    display: block;
    width: 100%; height: 100%;
    opacity: 0; transform: scale(1.04);
    animation: enter 1.1s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes enter { to { opacity: 1; transform: scale(1); } }

  @media (max-width: 600px) {
    :root { --nav-h: 68px; }
    .top-nav { padding: 14px 16px; }
    .nav-link { height: 36px; padding: 0 16px; font-size: 0.85rem; }
  }
</style>

<script>
  const root = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme) root.setAttribute('data-theme', savedTheme);
  themeBtn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  const inkLayer = document.getElementById('inkLayer');
  const blobs = inkLayer.querySelectorAll('.ink-blob');
  let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
  let hideTimer;
  document.addEventListener('mousemove', e => {
    mouseX = e.clientX; mouseY = e.clientY;
    inkLayer.classList.remove('is-hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => { inkLayer.classList.add('is-hidden'); }, 100);
  });
  function animateInk() {
    blobs.forEach((b, i) => {
      const lag = (i + 1) * 0.12;
      const x = parseFloat(b.dataset.x || mouseX);
      const y = parseFloat(b.dataset.y || mouseY);
      const nx = x + (mouseX - x) * lag;
      const ny = y + (mouseY - y) * lag;
      b.dataset.x = nx; b.dataset.y = ny;
      b.style.transform = 'translate('+nx+'px,'+ny+'px)';
    });
    requestAnimationFrame(animateInk);
  }
  animateInk();
</script>
