<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lxlylzl — 李威杰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ===== 5-COLOR STANDARD PALETTE ===== */
  :root {
    --bg: #0E0E0E;
    --text: #F9F9F9;
    --text-muted: #DBDBDB;
    --panel: #262626;
    --accent: #F24C30;
    --pill-bg: rgba(255,255,255,0.08);
    --pill-border: rgba(255,255,255,0.14);
  }
  [data-theme="light"] {
    --bg: #F9F9F9;
    --text: #0E0E0E;
    --text-muted: #262626;
    --panel: #DBDBDB;
    --pill-bg: rgba(0,0,0,0.07);
    --pill-border: rgba(0,0,0,0.12);
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', 'Inter', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    transition: background 0.45s ease, color 0.45s ease;
  }

  /* ===== TOP NAV: logo left / links centered / toggle right (fixed, full-screen) ===== */
  .top-nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    pointer-events: none;
  }
  .top-nav * { pointer-events: auto; }
  .nav-center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Logo pill */
  .nav-logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    cursor: pointer;
    transition: opacity 0.2s, background 0.25s;
    flex-shrink: 0;
  }
  .nav-logo-wrap:hover { opacity: 0.75; }
  .nav-logo {
    height: 24px;
    width: auto;
  }

  /* Each nav item = its own solid capsule */
  .nav-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 48px;
    padding: 0 28px;
    border-radius: 100px;
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    color: var(--text);
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    white-space: nowrap;
    transition: background 0.25s, border-color 0.25s, transform 0.15s;
  }
  .nav-link:hover {
    background: var(--panel);
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .nav-link.is-active {
    background: var(--panel);
    border-color: var(--text-muted);
    font-weight: 600;
  }

  /* Theme toggle */
  .theme-btn {
    width: 40px; height: 40px;
    border: none; background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center; justify-content: center;
    transition: color 0.3s, background 0.25s;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .theme-btn:hover { color: var(--accent); background: var(--panel); }
  .theme-btn svg {
    width: 18px; height: 18px;
    stroke: currentColor; fill: none;
    stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    .top-nav { padding: 16px 24px; gap: 10px; }
    .nav-link { height: 42px; padding: 0 22px; font-size: 0.95rem; }
    .nav-logo-wrap { width: 42px; height: 42px; }
    .nav-logo { height: 21px; }
  }
  @media (max-width: 600px) {
    .top-nav { padding: 14px 16px; gap: 8px; }
    .nav-link { height: 36px; padding: 0 16px; font-size: 0.85rem; }
    .nav-logo-wrap { width: 36px; height: 36px; }
    .nav-logo { height: 18px; }
    .theme-btn { width: 34px; height: 34px; }
  }
</style>
</head>
<body>

  <!-- ===== TOP NAV ===== -->
  <nav class="top-nav">
    <div class="nav-logo-wrap" id="logoBtn">
      <img class="nav-logo" src="logo.svg" alt="LX Logo">
    </div>

    <div class="nav-center">
      <a class="nav-link is-active" href="index.html">首页</a>
      <a class="nav-link" href="works.html">作品</a>
      <a class="nav-link" href="about.html">关于</a>
      <a class="nav-link" href="notes.html">碎碎念</a>
    </div>

    <button class="theme-btn" id="themeBtn" aria-label="切换明暗模式">
      <svg class="icon-sun" viewBox="0 0 24 24" style="display:none;">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </nav>

<script>
// ===== THEME =====
(function() {
  function getPreferredTheme() {
    const stored = localStorage.getItem('theme');
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const iconSun = document.querySelector('.icon-sun');
    const iconMoon = document.querySelector('.icon-moon');
    if (theme === 'light') {
      iconSun.style.display = '';
      iconMoon.style.display = 'none';
    } else {
      iconSun.style.display = 'none';
      iconMoon.style.display = '';
    }
    const logoImg = document.querySelector('.nav-logo');
    if (logoImg) logoImg.src = theme === 'light' ? 'logo-light.svg' : 'logo.svg';
  }
  applyTheme(getPreferredTheme());
  document.getElementById('themeBtn').addEventListener('click', function() {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
  });

  // Logo click -> home
  document.getElementById('logoBtn').addEventListener('click', function() {
    window.location.href = 'index.html';
  });
})();

</script>
</body>
</html>
