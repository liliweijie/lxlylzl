<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>脑内漫游 · NOTES · lXlYlZl</title>
  <link rel="icon" href="assets/space-mark-small.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/notes-brain-demo.css?v=10">
  <link rel="stylesheet" href="css/space-system.css">
  <link rel="stylesheet" href="css/spatial-type.css">
  <link rel="stylesheet" href="css/rail-gate.css">
  <link rel="stylesheet" href="css/navigation-shell.css">
  <link rel="canonical" href="https://lxlylzl.xyz/notes.html">
  <meta name="description" content="进入脑内褶皱，探索想法与神经元。李威杰的个人创作空间。">
</head>
<body class="brain-depth-demo" data-page="3">
  <a class="brain-skip" href="#thought-list">跳到想法节点</a>
  <header class="space-header"><a class="space-logo" href="index.html" aria-label="lxlylzl 首页"><img src="assets/space-mark.svg" alt=""><span><b>lXlYlZl</b><small>SPACE FOR IDEAS</small></span></a><nav class="space-links" aria-label="主要导航"><a href="index.html">HOME</a><a href="works.html">WORK</a><a href="about.html">ABOUT</a><a href="notes.html" aria-current="page">NOTES</a><a href="contact.html">CONTACT</a></nav><div class="space-meta"><span>04 / 05</span></div></header>
  <main id="brain-journey" aria-label="滚动进入无限脑部褶皱空间，点选神经元书写想法">
    <div class="brain-stage" id="brain-stage" tabindex="0">
      <div class="brain-canvas" id="brain-canvas" aria-hidden="true"></div>
      <p class="brain-loading" id="brain-loading" role="status">正在连接想法…</p>
      <div class="brain-nodes" id="thought-list" role="group" aria-label="沿途可书写的神经元" tabindex="-1"></div>
      <div class="brain-controls">
        <p id="brain-depth-marker" class="brain-depth-marker" role="status"></p>
        <button id="brain-reset" class="brain-home" type="button" aria-label="回到脑部入口" title="回到入口"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 7c-2-4-8-3-9 1-4 0-6 5-4 8-3 4 0 9 4 9 1 5 7 5 9 1 2 4 8 4 9-1 4 0 7-5 4-9 2-3 0-8-4-8-1-4-7-5-9-1Z"/><path d="M16 7v19M8 8c0 3 1 4 3 4M4 16c3-2 6-1 7 2M7 25c-1-3 1-5 4-5M24 8c0 3-1 4-3 4M28 16c-3-2-6-1-7 2M25 25c1-3-1-5-4-5"/></svg></button>
      </div>
    </div>
  </main>
  <dialog class="thought-dialog" id="thought-dialog" aria-labelledby="thought-heading">
    <form id="thought-form">
      <div class="thought-top"><p id="thought-number">01 / 灵感</p><button id="thought-close" class="thought-close" type="button" aria-label="关闭想法">×</button></div>
      <h2 id="thought-heading">让这个想法留下来。</h2>
      <label for="thought-title">主题</label><input id="thought-title" type="text" maxlength="80" autocomplete="off" placeholder="给这个想法起个名字">
      <label for="thought-content">此刻在想什么</label><textarea id="thought-content" rows="7" maxlength="4000" placeholder="一个念头、一点灵感，或者还没想明白的事。"></textarea>
      <div class="thought-bottom"><p id="thought-status" role="status">演示内容，尚未保存</p><button class="thought-save" type="submit">保存想法 <span aria-hidden="true">↗</span></button></div>
      <p class="thought-privacy">仅保存在当前浏览器，不会公开发布。<br>更换设备或清除浏览器数据后，不会保留。</p>
    </form>
  </dialog>
  <script type="module" src="js/notes-brain-depth-demo.js?v=16"></script>
  <script src="js/editorial-navigation.js?v=6" defer></script>
</body>
</html>
